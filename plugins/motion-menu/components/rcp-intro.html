<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 그래픽 자기소개 Kinetic Typography+BPM 비트 싱크+Text Stagger — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ri{position:relative;height:200px;margin:12px;border-radius:12px;overflow:hidden;background:#101611;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:ribg 2.4s steps(1,end) infinite}
  @keyframes ribg{0%,33%{background:#101611}34%,66%{background:#12201a}67%,100%{background:#1a130f}}
  .rin{font:900 30px system-ui;color:#38BE86;animation:ri1 2.4s steps(1,end) infinite}
  .rinum{font:800 40px system-ui;color:#E7D6BC;animation:ri2 2.4s steps(1,end) infinite}
  .ris{font:600 15px system-ui;color:#E07A3F;animation:ri3 2.4s steps(1,end) infinite}
  @keyframes ri1{0%,33%{opacity:1;transform:scale(1)}0%{transform:scale(1.3)}34%,100%{opacity:0}}
  @keyframes ri2{0%,33%{opacity:0}34%,66%{opacity:1}34%{transform:scale(1.3)}67%,100%{opacity:0}}
  @keyframes ri3{0%,66%{opacity:0}67%,100%{opacity:1}67%{transform:translateY(10px)}80%,100%{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.rin,.rinum,.ris{animation:none}.rinum,.ris{opacity:0}}
</style>
<div class="ri"><div class="rin">안상현</div><div class="rinum">19.5만</div><div class="ris">시간·돈·감정에서 자유로워지는 법</div></div>
<p class="cap">모션 그래픽 자기소개 · 이름 → 숫자 → 한 문장이 비트마다 바뀐다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
