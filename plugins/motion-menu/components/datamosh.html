<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>데이터모시 Datamosh — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .dm{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#4fb8e8;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(5,1fr)}
  .dm i{background:#E07A3F;filter:blur(1px);animation:dm 3.2s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes dm{0%,30%{transform:translateX(0);background:#E07A3F}55%{transform:translateX(26px);background:#b98bbf}80%,100%{transform:translateX(0);background:#4fb8e8}}
  @media(prefers-reduced-motion:reduce){.dm i{animation:none;transform:translateX(13px);background:#b98bbf}}
</style>
<div class="dm" id="dmgrid"></div>
<p class="cap">데이터모시 · 영상 압축의 번짐을 의도로 써 픽셀이 밀려 흐물흐물 섞인다(근사 재현). ≠ 또렷이 깨지는 글리치</p>
<script>(function(){var g=document.getElementById('dmgrid');if(!g)return;for(var i=0;i<50;i++){var s=document.createElement('i');s.style.animationDelay=(Math.random()*0.5).toFixed(2)+'s';g.appendChild(s);}})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
