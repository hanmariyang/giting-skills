<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오버래핑 액션 Overlapping Action — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ov{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .ovp{position:absolute;top:50%;border-radius:50%;animation:ovm 3.2s cubic-bezier(.45,0,.2,1) infinite}
  .ov1{width:40px;height:40px;margin-top:-34px;background:#E7D6BC;animation-delay:0s}
  .ov2{width:52px;height:40px;margin-top:-20px;border-radius:20px;background:#7a5af0;animation-delay:.12s;margin-left:-40px}
  .ov3{width:30px;height:16px;margin-top:-4px;border-radius:8px;background:#38BE86;animation-delay:.24s;margin-left:-72px}
  @keyframes ovm{0%,8%{left:22%}45%,100%{left:70%}}
  @media(prefers-reduced-motion:reduce){.ovp{animation:none;left:70%}}
</style>
<div class="ov"><div class="ovp ov3"></div><div class="ovp ov2"></div><div class="ovp ov1"></div></div>
<p class="cap">오버래핑 액션 · 머리(살구) → 몸(보라) → 꼬리(초록)가 조금씩 늦게 출발하고 늦게 멈춘다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
