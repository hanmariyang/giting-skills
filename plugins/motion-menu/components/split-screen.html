<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스플릿 스크린 Split Screen — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ss{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;display:flex}
  .ssa,.ssb{flex:1;display:flex;align-items:center;justify-content:center;font:800 15px system-ui;letter-spacing:.08em}
  .ssa{background:#2a3550;color:#aeb8cc}.ssb{background:#1a3b31;color:#9fe3c3}
  .ssd{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#E7D6BC;animation:ss 2.6s ease-in-out infinite}
  @keyframes ss{0%,100%{opacity:.5}50%{opacity:1;box-shadow:0 0 10px rgba(231,214,188,.6)}}
  @media(prefers-reduced-motion:reduce){.ssd{animation:none}}
</style>
<div class="ss"><div class="ssa">BEFORE</div><div class="ssb">AFTER</div><div class="ssd"></div></div>
<p class="cap">스플릿 스크린 · 화면을 나눠 둘 이상 장면을 동시에. ≠ 작은 창 하나를 겹치는 화면 속 화면(PiP)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
