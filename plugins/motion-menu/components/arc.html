<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>호 운동 Arcs — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ar{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .ar .g{position:absolute;width:8px;height:8px;margin:-4px;border-radius:50%;background:#2f3b52}
  .arb{position:absolute;width:26px;height:26px;margin:-13px;border-radius:50%;background:#E07A3F;animation:arb 2.6s linear infinite}
  @keyframes arb{0%{left:6%;top:124px}25%{left:28%;top:52px}50%{left:50%;top:26px}75%{left:72%;top:52px}100%{left:94%;top:124px}}
  @media(prefers-reduced-motion:reduce){.arb{animation:none;left:50%;top:26px}}
</style>
<div class="ar"><i class="g" style="left:6%;top:124px"></i><i class="g" style="left:28%;top:52px"></i><i class="g" style="left:50%;top:26px"></i><i class="g" style="left:72%;top:52px"></i><i class="g" style="left:94%;top:124px"></i><div class="arb"></div></div>
<p class="cap">호 운동(아크) · 자연물은 직선이 아니라 곡선(점선 궤적)을 그리며 움직인다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
