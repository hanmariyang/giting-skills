<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>롤 Roll — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st3{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .sc3{width:150%;height:150%;background:
    linear-gradient(#20633f 0 60%,#9fc7b0 60% 62%,#141821 62%);
    animation:roll 4s ease-in-out infinite alternate}
  @keyframes roll{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
  @media(prefers-reduced-motion:reduce){.sc3{animation:none}}
</style>
<div class="st3"><div class="sc3"></div></div>
<p class="cap">롤 · 렌즈 축으로 돌아 수평선이 기운다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
