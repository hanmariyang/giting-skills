<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>트랙 Track — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st4{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .far,.near{position:absolute;inset:0;width:180%}
  .far{background:radial-gradient(circle at 25% 30%,#39506a 0 9px,transparent 10px) 0 0/90px 90px;animation:trk 4s linear infinite alternate}
  .near{background:radial-gradient(circle at 15% 70%,#E07A3F 0 13px,transparent 14px) 0 0/70px 70px;animation:trk2 4s linear infinite alternate}
  @keyframes trk{from{transform:translateX(0)}to{transform:translateX(-18%)}}
  @keyframes trk2{from{transform:translateX(0)}to{transform:translateX(-40%)}}
  @media(prefers-reduced-motion:reduce){.far,.near{animation:none}}
</style>
<div class="st4"><div class="far"></div><div class="near"></div></div>
<p class="cap">트랙 · 몸이 옆으로 이동. 가까운 게 더 많이 움직인다(≠팬)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
