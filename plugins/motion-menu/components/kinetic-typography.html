<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>키네틱 타이포그래피 Kinetic Typography — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .kt{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center;gap:10px;font:800 30px system-ui;color:#8b93a1}
  .kt b{display:inline-block;animation:ktp 3s steps(1,end) infinite}
  .kt b:nth-child(1){animation-delay:0s}.kt b:nth-child(2){animation-delay:1s}.kt b:nth-child(3){animation-delay:2s}
  @keyframes ktp{0%,33%{color:#38BE86;transform:scale(1.35)}34%,100%{color:#8b93a1;transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.kt b{animation:none}.kt b:nth-child(1){color:#38BE86}}
</style>
<div class="kt"><b>말이</b><b>리듬을</b><b>탄다</b></div>
<p class="cap">키네틱 타이포그래피 · 글자 자체가 움직여 뜻과 리듬을 전한다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
