<script>(function(){
var TAU = Math.PI * 2;

      c.globalAlpha = (1 - seg(p, 4, .35)) * u;

    }

  };
var V={"rows":4,"top":4720},K={"ink":"#141821","paper":"#F4F1EA","sub":"#8b93a1","acc":"#E07A3F","acc2":"#7a5af0","purple":"#7a5af0","card":"#E7D6BC","green":"#38BE86","pink":"#E8506E"},STILL=2.6;
