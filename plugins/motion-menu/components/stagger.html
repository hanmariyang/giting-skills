<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스태거 Stagger — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .sg{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center;gap:14px}
  .sgc{width:40px;height:72px;border-radius:10px;background:#E7D6BC;animation:sg 2.8s cubic-bezier(.16,1,.3,1) infinite}
  .sgc:nth-child(2){animation-delay:.12s}
  .sgc:nth-child(3){animation-delay:.24s}
  @keyframes sg{0%{opacity:0;transform:translateY(26px)}35%,100%{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.sgc{animation:none;opacity:1;transform:none}}
</style>
<div class="sg"><div class="sgc"></div><div class="sgc"></div><div class="sgc"></div></div>
<p class="cap">스태거 · 여러 개를 0.1초씩 시간차로. 하나씩 차례로 뜬다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
