<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>픽셀 디졸브 Grid Dissolve — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .pd{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#4fb8e8;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,1fr)}
  .pd i{background:#E7D6BC;animation:pdc 3.2s steps(1,end) infinite}
  @keyframes pdc{0%,40%{opacity:1}60%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.pd i{animation:none;opacity:1}.pd i:nth-child(2n){opacity:0}}
</style>
<div class="pd" id="pdgrid"></div>
<p class="cap">픽셀(그리드) 디졸브 · 칸칸이 흩어지며 아래 화면이 차오른다</p>
<script>(function(){var g=document.getElementById('pdgrid');if(!g)return;for(var i=0;i<72;i++){var s=document.createElement('i');s.style.animationDelay=(Math.random()*0.9).toFixed(2)+'s';g.appendChild(s);}})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
