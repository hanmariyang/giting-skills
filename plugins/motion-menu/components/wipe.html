<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>와이프 Wipe — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .wp{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#E07A3F}
  .wpb{position:absolute;inset:0;background:#4fb8e8;display:flex;align-items:center;justify-content:center;font:700 19px system-ui;color:#fff;clip-path:inset(0 100% 0 0);animation:wp 3s ease-in-out infinite}
  @keyframes wp{0%,20%{clip-path:inset(0 100% 0 0)}55%,100%{clip-path:inset(0 0 0 0)}}
  @media(prefers-reduced-motion:reduce){.wpb{animation:none;clip-path:inset(0 0 0 0)}}
</style>
<div class="wp"><div class="wpb">화면 B</div></div>
<p class="cap">와이프 · 직선 경계가 왼쪽에서 오른쪽으로 쓸며 다음 화면을 드러냄</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
