<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>화면 속 화면 Picture-in-Picture — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .pp{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#243b2f,#141821);display:flex;align-items:center;justify-content:center;font:800 22px system-ui;color:#4a6a5a}
  .ppw{position:absolute;right:14px;bottom:14px;width:92px;height:58px;border-radius:7px;background:linear-gradient(135deg,#3a5270,#1b2334);border:2px solid #E7D6BC;display:flex;align-items:center;justify-content:center;font:700 11px system-ui;color:#cdd7e6;animation:pp 3.4s cubic-bezier(.16,1,.3,1) infinite}
  @keyframes pp{0%{transform:translate(20px,20px) scale(.6);opacity:0}18%,86%{transform:none;opacity:1}100%{transform:translate(20px,20px) scale(.6);opacity:0}}
  @media(prefers-reduced-motion:reduce){.ppw{animation:none}}
</style>
<div class="pp">MAIN<div class="ppw">CAM</div></div>
<p class="cap">화면 속 화면(PiP) · 큰 화면 위에 작은 창을 겹쳐 둘을 함께. ≠ 화면을 반반 나누는 스플릿 스크린</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
