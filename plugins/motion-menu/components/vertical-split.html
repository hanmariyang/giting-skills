<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>세로 스플릿 Vertical Split — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st{display:block;width:calc(100% - 24px);height:170px;margin:12px;border-radius:12px;background:#14161B}
</style>
<canvas class="st" role="img" aria-label="세로 스플릿 데모: 화면 A 에서 B 로 넘어갔다가 돌아온다"></canvas>
<p class="cap">세로 스플릿 · 왼쪽 절반은 위에서, 오른쪽 절반은 아래에서 슬롯처럼 바뀐다.</p>
<script>(function(){
var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var io = function (t) { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
var eo = function (t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
var ei = function (t) { t = clamp(t); return t * t * t; };
var back = function (t) { t = clamp(t); var s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
var hash = function (i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
var fillWith = function (c, path, draw) { c.save(); c.beginPath(); path(); c.clip(); draw(); c.restore(); };
var solid = function (c, w, h, col) { return function () { c.fillStyle = col; c.fillRect(0, 0, w, h); }; };
var poly = function (c, pts) { c.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); };
var scene = function (c, w, h, bg, fg, ch) {
  return function () {
    c.fillStyle = bg; c.fillRect(0, 0, w, h);
    c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = '800 ' + Math.round(h * .42) + 'px -apple-system,system-ui,sans-serif';
    c.fillText(ch, w / 2, h / 2 + h * .03);
  };
};
var T=function (c, w, h, p, A, B, k) {
  A();
  var q = back(io(p));
  fillWith(c, function () { c.rect(0, 0, w / 2 + .5, h * q); c.rect(w / 2 - .5, h - h * q, w / 2 + .5, h * q); }, B);
};
var cv=document.querySelector('canvas.st'),c=cv.getContext('2d'),K={acc:'#6B5AE0',deep:'#443b87',paper:'#F4F1EA',ink:'#14161B',n:0};
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function sizeCanvas(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c.setTransform(d,0,0,d,0,0);}
function frame(now){
  var r=cv.getBoundingClientRect(),w=r.width,h=r.height,t=still?1.2:(Math.max(0,(now-t0)/1000))%4,cyc=Math.floor((now-t0)/4000);
  var SA=scene(c,w,h,K.ink,K.paper,'A'),SB=scene(c,w,h,K.acc,K.ink,'B');
  K.n=cyc*2+(t<2?0:1);
  c.save();c.beginPath();c.rect(0,0,w,h);c.clip();
  if(t<.4)SA();else if(t<1.8)T(c,w,h,(t-.4)/1.4,SA,SB,K);else if(t<2.4)SB();else if(t<3.8)T(c,w,h,(t-2.4)/1.4,SB,SA,K);else SA();
  c.restore();
  if(!still)requestAnimationFrame(frame);
}
sizeCanvas();addEventListener('resize',sizeCanvas);requestAnimationFrame(frame);
})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
