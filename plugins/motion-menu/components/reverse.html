<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>리버스 Reverse Motion — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .rv{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .rv i{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:5px;background:#E07A3F;animation:rv 2.8s cubic-bezier(.5,0,.5,1) infinite}
  .rv i:nth-child(1){--x:-120px;--y:-44px}.rv i:nth-child(2){--x:120px;--y:-44px;background:#38BE86}
  .rv i:nth-child(3){--x:-120px;--y:44px;background:#4fb8e8}.rv i:nth-child(4){--x:120px;--y:44px}
  .rvtag{position:absolute;top:10px;right:12px;font:700 13px system-ui;color:#9fe3c3}
  @keyframes rv{0%{transform:translate(var(--x),var(--y));opacity:.5}50%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--x),var(--y));opacity:.5}}
  @media(prefers-reduced-motion:reduce){.rv i{animation:none;transform:translate(0,0)}}
</style>
<div class="rv"><i></i><i></i><i></i><i></i><span class="rvtag">◀ REV</span></div>
<p class="cap">리버스 · 거꾸로 재생해 흩어진 조각이 도로 모인다. ≠ 앞뒤로 왕복하는 핑퐁 루프</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
