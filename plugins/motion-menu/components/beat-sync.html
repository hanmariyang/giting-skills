<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BPM 비트 싱크 Beat-synced Cut · 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .kn{display:block;width:calc(100% - 24px);height:170px;margin:12px;border-radius:12px;background:#141821}
</style>
<canvas class="kn" role="img" aria-label="BPM 비트 싱크 데모: 요청 문장의 값 그대로 움직인다"></canvas>
<p class="cap">BPM 비트 싱크 · 컷·강조가 음악 비트에 맞아떨어짐(다운비트에 프리즈도).</p>
<script>(function(){
var TAU = Math.PI * 2;
var cl = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var io = function (t) { t = cl(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
var eo = function (t) { t = cl(t); return 1 - Math.pow(1 - t, 3); };
var backS = function (t, s) { t = cl(t); return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
// 이즈 아웃 백의 최고값이 target 이 되는 s. 문장에 적힌 배율이 그림에서도 정말 그 배율이 되게 한다
var peakOf = function (s) { var m = 1; for (var i = 1; i < 200; i++) { var v = backS(i / 200, s); if (v > m) m = v; } return m; };
var solveS = function (target) { if (target <= 1.0005) return 0; var a = 0, b = 10; for (var i = 0; i < 40; i++) { var m = (a + b) / 2; if (peakOf(m) < target) a = m; else b = m; } return (a + b) / 2; };
var bgc = function (c, w, h, col) { c.fillStyle = col; c.fillRect(0, 0, w, h); };
var FONT = function (px, wt) { return (wt || 700) + ' ' + Math.round(px) + 'px -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif'; };
var MONO = function (px) { return '700 ' + Math.round(px) + 'px ui-monospace,Menlo,monospace'; };
var say = function (c, s, x, y, font, col, al) { c.font = font; c.fillStyle = col; c.textAlign = al || 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y); };
var rbox = function (c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); };
var fmt = function (v) { return String(Math.round(v * 100) / 100); };
var F=function (c, w, h, t, V, k) {
    var ib = 60 / V.bpm, fz = Math.min(V.freeze, ib * .9), bar = 4 * ib, kb = Math.floor(t / bar), within = t - kb * bar;
    var beat = Math.floor(t / ib), b4 = beat % 4, frozen = within < fz;
    var cols = [k.ink, '#1d2433', '#191f2b', '#232a3a'];
    bgc(c, w, h, cols[b4]);
    var mt = t - kb * fz - Math.min(within, fz);
    var x = w / 2 + Math.sin(mt * Math.PI * 2 / (ib * 2)) * w * .3;
    c.fillStyle = frozen ? k.paper : k.acc2; rbox(c, x - 20, h * .5 - 20, 40, 40, 10); c.fill();
    for (var i = 0; i < 4; i++) { c.fillStyle = i === b4 ? (i === 0 ? k.paper : k.acc) : 'rgba(244,241,234,.18)'; c.beginPath(); c.arc(w / 2 - 33 + i * 22, h - 22, i === 0 ? 6 : 5, 0, TAU); c.fill(); }
    say(c, Math.round(V.bpm) + ' BPM', 12, 14, MONO(12), k.sub, 'left');
    if (frozen) say(c, '프리즈 ' + fmt(V.freeze) + '초', w - 12, 14, FONT(12, 800), k.paper, 'right');
  };
var V={"bpm":120,"freeze":0.1},K={"ink":"#141821","paper":"#F4F1EA","sub":"#8b93a1","acc":"#E07A3F","acc2":"#7a5af0","purple":"#7a5af0","card":"#E7D6BC","green":"#38BE86","pink":"#E8506E"},STILL=0;
var cv=document.querySelector('canvas.kn'),c=cv.getContext('2d');
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function sizeCanvas(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c.setTransform(d,0,0,d,0,0);}
function draw(now){var r=cv.getBoundingClientRect();c.save();c.beginPath();c.rect(0,0,r.width,r.height);c.clip();F(c,r.width,r.height,still?STILL:Math.max(0,(now-t0)/1000),V,K);c.restore();}
function frame(now){draw(now);if(!still)requestAnimationFrame(frame);}
addEventListener('message',function(e){var d=e.data&&e.data.mok;if(!d)return;for(var k in d)if(k in V&&isFinite(+d[k]))V[k]=+d[k];t0=performance.now();if(still)draw(t0);});
sizeCanvas();addEventListener('resize',function(){sizeCanvas();if(still)draw(performance.now());});requestAnimationFrame(frame);
})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
