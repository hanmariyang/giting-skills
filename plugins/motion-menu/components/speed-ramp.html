<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스피드 램핑 Speed Ramp — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .sr{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center}
  .srt{position:absolute;left:0;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:10px;background:#4fb8e8;animation:sr 3s infinite}
  @keyframes sr{0%{left:6%}30%{left:24%}45%{left:72%}70%{left:88%}100%{left:88%}}
  @media(prefers-reduced-motion:reduce){.srt{animation:none}}
</style>
<div class="sr"><div class="srt"></div></div>
<p class="cap">스피드 램핑 · 느리게 → 확 빠르게 → 다시 느리게 (한 클립 안)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
