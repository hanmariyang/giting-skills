<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스쿼시 앤 스트레치 Squash &amp; Stretch — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .sq{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .sqb{position:absolute;left:50%;top:18px;width:50px;height:50px;margin-left:-25px;border-radius:50%;background:#E07A3F;transform-origin:center bottom;animation:sq 1.8s cubic-bezier(.5,.05,.5,.95) infinite}
  @keyframes sq{0%{top:18px;transform:scaleY(1.15) scaleX(.9)}40%{top:96px;transform:scaleY(1.2) scaleX(.85)}50%{top:106px;transform:scaleY(.55) scaleX(1.4)}60%{top:96px;transform:scaleY(1.2) scaleX(.85)}100%{top:18px;transform:scaleY(1.15) scaleX(.9)}}
  @media(prefers-reduced-motion:reduce){.sqb{animation:none;top:96px}}
</style>
<div class="sq"><div class="sqb"></div></div>
<p class="cap">스쿼시 앤 스트레치 · 떨어질 땐 늘어나고 바닥에선 눌린다 (무게·탄성)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
