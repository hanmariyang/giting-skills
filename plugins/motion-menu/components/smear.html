<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스미어 프레임 Smear Frame — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .sm{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center}
  .smb{position:absolute;top:50%;margin-top:-18px;width:36px;height:36px;border-radius:9px;background:#E07A3F;transform-origin:center;animation:sm 2.6s linear infinite}
  @keyframes sm{0%,34%{left:8%;transform:scaleX(1);border-radius:9px;opacity:1}42%{left:24%;transform:scaleX(4.5);border-radius:9px/18px;opacity:.75}56%{left:66%;transform:scaleX(4.5);border-radius:9px/18px;opacity:.75}64%,100%{left:88%;transform:scaleX(1);border-radius:9px;opacity:1}}
  @media(prefers-reduced-motion:reduce){.smb{animation:none;left:46%;transform:scaleX(4.5);opacity:.75}}
</style>
<div class="sm"><div class="smb"></div></div>
<p class="cap">스미어 프레임 · 빠른 중간 프레임을 형태째 길게 늘여 속도감(손그림 기법). ≠ 흐릿한 모션 블러</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
