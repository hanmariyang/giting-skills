<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>글리치 Glitch — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .gl{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#0c0f15;display:flex;align-items:center;justify-content:center}
  .glt{position:relative;font:800 38px system-ui;color:#E7D6BC;letter-spacing:.04em}
  .glt::before,.glt::after{content:"GLITCH";position:absolute;left:0;top:0}
  .glt::before{color:#ff4d6d;animation:gla 1.6s steps(2,end) infinite}
  .glt::after{color:#4fb8e8;animation:glb 1.6s steps(2,end) infinite}
  @keyframes gla{0%,70%{clip-path:inset(0 0 100% 0);transform:none}76%{clip-path:inset(10% 0 40% 0);transform:translateX(-5px)}82%{clip-path:inset(60% 0 10% 0);transform:translateX(4px)}88%,100%{clip-path:inset(0 0 100% 0);transform:none}}
  @keyframes glb{0%,70%{clip-path:inset(0 0 100% 0);transform:none}79%{clip-path:inset(45% 0 20% 0);transform:translateX(5px)}85%{clip-path:inset(20% 0 55% 0);transform:translateX(-4px)}90%,100%{clip-path:inset(0 0 100% 0);transform:none}}
  @media(prefers-reduced-motion:reduce){.glt::before,.glt::after{animation:none;clip-path:inset(0 0 100% 0)}}
</style>
<div class="gl"><div class="glt">GLITCH</div></div>
<p class="cap">글리치 · 순간적으로 어긋나고 깨져 디지털 오류처럼 보인다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
