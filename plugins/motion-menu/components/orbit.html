<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오빗 Orbit — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st8{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;perspective:600px;display:flex;align-items:center;justify-content:center}
  .sc8{transform-style:preserve-3d;animation:orb 5s linear infinite}
  .face{position:absolute;width:70px;height:70px;margin:-35px;border-radius:10px;background:#E7D6BC;left:50%;top:50%}
  .face.b{background:#7a5af0aa;transform:rotateY(90deg) translateZ(35px)}
  .face.c{background:#4fb8e8aa;transform:rotateY(180deg) translateZ(35px)}
  .face.d{background:#E07A3Faa;transform:rotateY(270deg) translateZ(35px)}
  .face.a{transform:translateZ(35px)}
  @keyframes orb{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
  @media(prefers-reduced-motion:reduce){.sc8{animation:none}}
</style>
<div class="st8"><div class="sc8"><div class="face a"></div><div class="face b"></div><div class="face c"></div><div class="face d"></div></div></div>
<p class="cap">오빗 · 대상 주위를 돈다. 대상은 가운데, 배경만 돈다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
