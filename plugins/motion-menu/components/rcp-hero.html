<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>깊이감 히어로 Parallax+2.5D Camera+Ease Out — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .rh{position:relative;height:220px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;perspective:900px;display:flex;align-items:center;justify-content:center}
  .rhs{position:relative;width:170px;height:150px;transform-style:preserve-3d;animation:rh 6s ease-in-out infinite alternate}
  .rhl{position:absolute;inset:0;margin:auto;border-radius:12px}
  .rh1{width:160px;height:110px;background:#2a3550;transform:translateZ(-70px);animation:rhin 3s cubic-bezier(.16,1,.3,1) both}
  .rh2{width:120px;height:82px;background:#39607a;transform:translateZ(0);animation:rhin 3s cubic-bezier(.16,1,.3,1) .12s both}
  .rh3{width:70px;height:70px;background:#E07A3F;transform:translateZ(70px);animation:rhin 3s cubic-bezier(.16,1,.3,1) .24s both}
  @keyframes rh{from{transform:rotateY(-20deg)}to{transform:rotateY(20deg)}}
  @keyframes rhin{0%{opacity:0}100%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.rhs,.rhl{animation:none;opacity:1}}
</style>
<div class="rh"><div class="rhs"><div class="rhl rh1"></div><div class="rhl rh2"></div><div class="rhl rh3"></div></div></div>
<p class="cap">깊이감 히어로 · 레이어를 2.5D 카메라로 돌리고 이즈 아웃 등장</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
