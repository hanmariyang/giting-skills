<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>홀드 Hold — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .hd{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .hdb{position:absolute;bottom:34px;width:46px;height:46px;border-radius:10px;background:#7a5af0;animation:hdm 3.4s cubic-bezier(.4,0,.2,1) infinite}
  .hdl{position:absolute;left:0;right:0;bottom:33px;height:1px;background:#2c3342}
  .hdt{position:absolute;left:50%;top:18px;transform:translateX(-50%);font:600 11px ui-monospace,monospace;color:#E07A3F;opacity:0;animation:hdt 3.4s infinite}
  @keyframes hdm{0%{left:6%;transform:translateY(0)}22%{left:30%;transform:translateY(-70px)}36%{left:46%;transform:translateY(0) scale(1.12,.86)}40%,66%{left:46%;transform:translateY(0) scale(1)}100%{left:84%;transform:translateY(0)}}
  @keyframes hdt{0%,38%{opacity:0}42%,64%{opacity:1}68%,100%{opacity:0}}
  @media(prefers-reduced-motion:reduce){.hdb,.hdt{animation:none}.hdb{left:46%}}
</style>
<div class="hd"><div class="hdl"></div><div class="hdt">HOLD 0.3s</div><div class="hdb"></div></div>
<p class="cap">홀드 · 착지한 포즈에서 잠깐 멈췄다가 다음 동작으로 간다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
