<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>줌 아웃 트랙 인 Dolly Zoom — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .dz{position:relative;height:190px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .dzbg{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#1b2130 0 2px,transparent 2px 40px),repeating-linear-gradient(#1b2130 0 2px,transparent 2px 40px);animation:dzb 4s ease-in-out infinite alternate}
  .dzp{position:relative;width:56px;height:84px;border-radius:12px;background:#E7D6BC}
  @keyframes dzb{from{transform:scale(1.6)}to{transform:scale(.7)}}
  @media(prefers-reduced-motion:reduce){.dzbg{animation:none}}
</style>
<div class="dz"><div class="dzbg"></div><div class="dzp"></div></div>
<p class="cap">줌 아웃 트랙 인 · 인물은 그대로, 배경만 밀려난다(현기증)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
