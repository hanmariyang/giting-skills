<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>크로스 디졸브 Cross Dissolve — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .cd{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .cda,.cdb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 20px system-ui;color:#0c0f15}
  .cda{background:#E7D6BC;animation:cdfa 3s ease-in-out infinite}
  .cdb{background:#4fb8e8;animation:cdfb 3s ease-in-out infinite}
  @keyframes cdfa{0%,30%{opacity:1}55%,100%{opacity:0}}
  @keyframes cdfb{0%,30%{opacity:0}55%,100%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.cda,.cdb{animation:none}.cdb{opacity:.5}}
</style>
<div class="cd"><div class="cda">화면 A</div><div class="cdb">화면 B</div></div>
<p class="cap">크로스 디졸브 · A가 서서히 사라지며 B가 겹쳐 떠오른다 (가장 기본 전환)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
