<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>팬 Pan — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;perspective:700px}
  .sc{position:absolute;inset:0;width:180%;background:
    radial-gradient(circle at 20% 40%,#E07A3F55 0 7px,transparent 8px),
    radial-gradient(circle at 70% 70%,#4fb8e855 0 7px,transparent 8px),
    linear-gradient(90deg,#1b2130 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(#1b2130 1px,transparent 1px) 0 0/36px 36px,#141821;
    animation:pan 3.6s ease-in-out infinite alternate}
  .hero{position:absolute;left:40%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:10px;background:#E7D6BC}
  @keyframes pan{from{transform:translateX(0)}to{transform:translateX(-33%)}}
  @media(prefers-reduced-motion:reduce){.sc{animation:none}}
</style>
<div class="st"><div class="sc"></div><div class="hero"></div></div>
<p class="cap">팬 · 제자리에서 좌우로. 화면 속 모든 게 똑같이 밀린다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
