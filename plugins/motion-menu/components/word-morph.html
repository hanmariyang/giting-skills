<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>워드 모프 Word Morph — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .wm{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .wm span{position:absolute;font:800 34px system-ui;color:#E7D6BC}
  .wma{animation:wma 3s ease-in-out infinite}
  .wmb{color:#38BE86;animation:wmb 3s ease-in-out infinite}
  @keyframes wma{0%,30%{opacity:1;filter:blur(0);transform:scale(1)}50%,100%{opacity:0;filter:blur(6px);transform:scale(.85)}}
  @keyframes wmb{0%,30%{opacity:0;filter:blur(6px);transform:scale(1.15)}50%,100%{opacity:1;filter:blur(0);transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.wma,.wmb{animation:none}.wmb{opacity:1}.wma{opacity:0}}
</style>
<div class="wm"><span class="wma">아이디어</span><span class="wmb">완성</span></div>
<p class="cap">워드 모프 · 한 단어의 글자가 녹듯 다른 단어로 변형된다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
