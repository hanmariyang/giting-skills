<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>순위 도장 Rank Stamp · 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .kn{display:block;width:calc(100% - 24px);height:170px;margin:12px;border-radius:12px;background:#141821}
</style>
<canvas class="kn" role="img" aria-label="순위 도장 데모: 요청 문장의 값 그대로 움직인다"></canvas>
<p class="cap">순위 도장 · 큰 「N위」가 커졌다 줄어들며 찍히고, 닿는 순간 둘레로 빛줄기가 터지며 위에 No. 칩이 붙는다.</p>
<script>(function(){
var TAU = Math.PI * 2;
var cl = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var io = function (t) { t = cl(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
var eo = function (t) { t = cl(t); return 1 - Math.pow(1 - t, 3); };
var back = function (t) { t = cl(t); var s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
var seg = function (t, a, d) { return cl((t - a) / d); };
var bgc = function (c, w, h, col) { c.fillStyle = col; c.fillRect(0, 0, w, h); };
var NFONT = function (px, wt) { return (wt || 800) + ' ' + Math.round(px) + 'px -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif'; };
var MFONT = function (px, wt) { return (wt || 700) + ' ' + Math.round(px) + 'px "SF Mono",Menlo,monospace'; };
var say = function (c, s, x, y, font, col, al) { c.font = font; c.fillStyle = col; c.textAlign = al || 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y); };
var sw = function (c, s, font) { c.font = font; return c.measureText(s).width; };
var rbox = function (c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); };
var comma = function (v) { return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
var PANEL = '#1F2431', DIM = '#3A4152';
var chip = function (c, s, x, y, font, bg, fg, sc) { var tw = sw(c, s, font), hh = parseInt(font.split(' ')[1]) * 1.55, ww = tw + hh * .8; c.save(); c.translate(x, y); c.scale(sc, sc); c.fillStyle = bg; rbox(c, -ww / 2, -hh / 2, ww, hh, hh / 2); c.fill(); say(c, s, 0, 1, font, fg); c.restore(); return ww; };
var F=function (c, w, h, t, V, k) {
    bgc(c, w, h, k.ink);
    var L = 3.4, p = t % L; c.globalAlpha = 1 - seg(p, 3, .35);
    var u = seg(p, .2, .35), cx = w / 2, cy = h * .56, n = Math.round(V.rank), rays = Math.round(V.rays);
    if (u > 0) {
      var sc = 1 + 1.3 * (1 - eo(u)), nf = NFONT(h * .5, 900), ns = String(n), nw = sw(c, ns, nf), uf = NFONT(h * .16, 800), uw = sw(c, '위', uf);
      var hit = seg(p, .55, .55);
      if (hit > 0 && hit < 1) {
        c.strokeStyle = k.acc; c.lineWidth = 3; c.lineCap = 'round';
        for (var i = 0; i < rays; i++) {
          var a = i * TAU / rays - Math.PI / 2, r1 = h * (.3 + .12 * eo(hit)), r2 = r1 + h * .1 * (1 - hit);
          c.globalAlpha = (1 - hit) * (1 - seg(p, 3, .35));
          c.beginPath(); c.moveTo(cx + Math.cos(a) * r1 * 1.25, cy + Math.sin(a) * r1); c.lineTo(cx + Math.cos(a) * r2 * 1.25, cy + Math.sin(a) * r2); c.stroke();
        }
        c.globalAlpha = 1 - seg(p, 3, .35);
      }
      c.save(); c.globalAlpha *= cl(u * 3); c.translate(cx, cy); c.scale(sc, sc);
      var tw = nw + uw + 4;
      say(c, ns, -tw / 2 + nw / 2, 0, nf, k.acc); say(c, '위', tw / 2 - uw / 2, h * .1, uf, k.paper);
      c.restore();
      var cp = back(seg(p, .75, .35));
      if (cp > 0) chip(c, 'No.' + n, cx, h * .17, NFONT(h * .075, 800), k.acc, k.ink, cp);
    }
    c.globalAlpha = 1;
  };
var V={"rank":1,"rays":8},K={"ink":"#141821","paper":"#F4F1EA","sub":"#8b93a1","acc":"#E07A3F","acc2":"#7a5af0","purple":"#7a5af0","card":"#E7D6BC","green":"#38BE86","pink":"#E8506E"},STILL=1.6;
var cv=document.querySelector('canvas.kn'),c=cv.getContext('2d');
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function sizeCanvas(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c.setTransform(d,0,0,d,0,0);}
function draw(now){var r=cv.getBoundingClientRect();c.save();c.beginPath();c.rect(0,0,r.width,r.height);c.clip();F(c,r.width,r.height,still?STILL:Math.max(0,(now-t0)/1000),V,K);c.restore();}
function frame(now){draw(now);if(!still)requestAnimationFrame(frame);}
addEventListener('message',function(e){var d=e.data&&e.data.mok;if(!d)return;for(var k in d)if(k in V&&isFinite(+d[k]))V[k]=+d[k];t0=performance.now();if(still)draw(t0);});
sizeCanvas();addEventListener('resize',function(){sizeCanvas();if(still)draw(performance.now());});requestAnimationFrame(frame);
})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
