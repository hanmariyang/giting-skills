<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스트로브 Strobe — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .sb{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center;animation:sb 2.4s steps(1,end) infinite}
  @keyframes sb{0%,60%{background:#141821}64%{background:#fff}68%{background:#141821}72%{background:#fff}76%{background:#141821}80%{background:#fff}84%{background:#141821}88%{background:#fff}92%,100%{background:#141821}}
  .sbt{font:900 30px system-ui;color:#8b93a1;mix-blend-mode:difference}
  @media(prefers-reduced-motion:reduce){.sb{animation:none;background:#141821}}
</style>
<div class="sb"><span class="sbt">DROP</span></div>
<p class="cap">스트로브 · 밝기가 빠르게 켜졌다 꺼졌다 점멸(광과민 주의). ≠ 색 채널 어긋나는 RGB 분리</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
