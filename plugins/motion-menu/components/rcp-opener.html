<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>제품 소개 오프너 Punch In+Ease Out+Stagger — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ro{position:relative;height:200px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .rot{font:800 26px system-ui;color:#E7D6BC;animation:rot 3.2s steps(1,end) infinite}
  .rorow{display:flex;gap:10px}
  .roc{width:46px;height:30px;border-radius:7px;background:#E07A3F;animation:roc 3.2s cubic-bezier(.16,1,.3,1) infinite}
  .roc:nth-child(2){animation-delay:.12s}.roc:nth-child(3){animation-delay:.24s}
  @keyframes rot{0%,10%{transform:scale(2.2);opacity:0}11%,100%{transform:scale(1);opacity:1}}
  @keyframes roc{0%,35%{opacity:0;transform:translateY(22px)}60%,100%{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.rot,.roc{animation:none;opacity:1;transform:none}}
</style>
<div class="ro"><div class="rot">GITING</div><div class="rorow"><div class="roc"></div><div class="roc"></div><div class="roc"></div></div></div>
<p class="cap">오프너 · 제목은 펀치 인, 카드는 이즈 아웃 + 스태거</p>

</body></html>
