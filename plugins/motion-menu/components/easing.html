<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>이징 Easing — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .es{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:0 14px}
  .esr{position:relative;height:34px}
  .esl{position:absolute;left:4px;top:7px;font:600 11px system-ui;color:#8b93a1}
  .esb{position:absolute;top:0;width:28px;height:28px;border-radius:8px}
  .lin{background:#6c7687;animation:esmv 3s linear infinite alternate}
  .eas{background:#E07A3F;animation:esmv 3s cubic-bezier(.5,0,.1,1) infinite alternate}
  @keyframes esmv{from{left:70px}to{left:calc(100% - 32px)}}
  @media(prefers-reduced-motion:reduce){.esb{animation:none}}
</style>
<div class="es">
  <div class="esr"><span class="esl">리니어</span><div class="esb lin"></div></div>
  <div class="esr"><span class="esl">이징</span><div class="esb eas"></div></div>
</div>
<p class="cap">이징 · 가속·감속 곡선. 없으면(위, 리니어) 기계처럼 보인다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
