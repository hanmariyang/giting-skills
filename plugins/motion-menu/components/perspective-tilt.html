<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>퍼스펙티브 틸트 Perspective Tilt — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .pt{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center;perspective:500px}
  .ptc{width:120px;height:90px;border-radius:10px;background:linear-gradient(#E7D6BC,#b9a888);animation:pt 4s ease-in-out infinite alternate}
  @keyframes pt{from{transform:rotateX(0)}to{transform:rotateX(52deg)}}
  @media(prefers-reduced-motion:reduce){.ptc{animation:none}}
</style>
<div class="pt"><div class="ptc"></div></div>
<p class="cap">퍼스펙티브 틸트 · 평면을 뒤로 눕힌다. 위쪽이 멀어져 보인다(≠롤)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
