<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모션 블러 Motion Blur — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .mb{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center}
  .mbc{position:absolute;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:10px;background:#4fb8e8;animation:mb 2.2s ease-in-out infinite}
  @keyframes mb{0%{left:6%;filter:blur(0)}45%{filter:blur(7px)}50%{left:72%}90%,100%{left:78%;filter:blur(0)}}
  @media(prefers-reduced-motion:reduce){.mbc{animation:none}}
</style>
<div class="mb"><div class="mbc"></div></div>
<p class="cap">모션 블러 · 빠른 구간에 가로 잔상. 없으면 뚝뚝 끊겨 보인다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
