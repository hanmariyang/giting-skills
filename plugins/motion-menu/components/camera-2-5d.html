<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>2.5D 카메라 2.5D Camera — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .cd{position:relative;height:190px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;perspective:800px;display:flex;align-items:center;justify-content:center}
  .cds{position:relative;width:140px;height:140px;transform-style:preserve-3d;animation:cd 6s ease-in-out infinite alternate}
  .cl{position:absolute;inset:0;margin:auto;border-radius:12px}
  .l1{width:130px;height:90px;background:#2a3550;transform:translateZ(-60px)}
  .l2{width:100px;height:70px;background:#39607a;transform:translateZ(0)}
  .l3{width:60px;height:60px;background:#E07A3F;transform:translateZ(60px)}
  @keyframes cd{from{transform:rotateY(-22deg)}to{transform:rotateY(22deg)}}
  @media(prefers-reduced-motion:reduce){.cds{animation:none}}
</style>
<div class="cd"><div class="cds"><div class="cl l1"></div><div class="cl l2"></div><div class="cl l3"></div></div></div>
<p class="cap">2.5D 카메라 · 겹친 평면 레이어를 카메라로 돌려 깊이를 만든다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
