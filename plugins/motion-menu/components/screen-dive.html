<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>화면 속 다이브 Screen Dive — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .sd{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center;perspective:600px}
  .sds{width:150px;height:96px;border-radius:10px;background:#1b2334;border:3px solid #39506a;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:sd 3.4s cubic-bezier(.6,0,.3,1) infinite}
  .sdi{width:70%;height:60%;border-radius:6px;background:linear-gradient(135deg,#1A8F63,#38BE86);display:flex;align-items:center;justify-content:center;font:700 13px system-ui;color:#eafff4}
  @keyframes sd{0%,20%{transform:scale(1)}70%,100%{transform:scale(6);border-radius:0}}
  @media(prefers-reduced-motion:reduce){.sds{animation:none}}
</style>
<div class="sd"><div class="sds"><div class="sdi">안의 장면</div></div></div>
<p class="cap">화면 속 다이브(푸시스루) · 카메라가 화면 속으로 들어가 그 안 장면이 꽉 찬다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
