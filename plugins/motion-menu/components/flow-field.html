<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>흐름장 입자 Flow Field · 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .bg{display:block;width:calc(100% - 24px);height:170px;margin:12px;border-radius:12px;background:#14161B}
</style>
<canvas class="bg" role="img" aria-label="흐름장 입자 데모: 반복해서 움직이는 배경"></canvas>
<p class="cap">흐름장 입자 · 가는 선 수백 개가 보이지 않는 물길을 따라 흘러가며 꼬리를 남겼다 사라진다.</p>
<script>(function(){
var TAU = Math.PI * 2;
var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var io = function (t) { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
var eo = function (t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
var back = function (t) { t = clamp(t); var s = 1.9; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
var frac = function (v) { return v - Math.floor(v); };
var hash = function (i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
var W8 = function (t, n) { return TAU * (n || 1) * t / 8; };
var fill = function (c, col) { c.fillStyle = col; };
var dot = function (c, x, y, r) { if (r > .3) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); } };
var bgc = function (c, w, h, col) { c.fillStyle = col; c.fillRect(0, 0, w, h); };
var lerpC = function (a, b, t) { return '#' + [1, 3, 5].map(function (i) { return Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0'); }).join(''); };
var ngon = function (c, x, y, r, n, rot) { c.beginPath(); for (var i = 0; i < n; i++) { var a = rot + i * TAU / n; if (i) c.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); else c.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)); } c.closePath(); };
var F=function (c, w, h, t, k) {
  bgc(c, w, h, k.paper);
  var N = Math.round(90 * w / h) + 40, st = h * .024, S = 40;
  var ang = function (x, y) { return Math.sin(x / h * 1.7) * 1.6 + Math.cos(y / h * 2.3 + x / h * .6) * 1.4; };
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (var i = 0; i < N; i++) {
    var age = frac(t / 4 + hash(i + 7)), head = Math.floor(age * S), x = hash(i) * (w + h) - h * .5, y = hash(i + 99) * h, pts = [];
    for (var s = 0; s <= head; s++) { pts.push(x, y); var a = ang(x, y); x += Math.cos(a) * st; y += Math.sin(a) * st; }
    var from = Math.max(0, head - 12); if (head - from < 1) continue;
    c.globalAlpha = Math.sin(Math.PI * age) * .8; c.strokeStyle = i % 6 ? k.ink : k.acc; c.lineWidth = i % 6 ? h * .007 : h * .013;
    c.beginPath(); c.moveTo(pts[from * 2], pts[from * 2 + 1]); for (var j = from + 1; j <= head; j++) c.lineTo(pts[j * 2], pts[j * 2 + 1]); c.stroke();
  }
  c.globalAlpha = 1;
};
var cv=document.querySelector('canvas.bg'),c=cv.getContext('2d'),K={acc:'#17A88A',deep:'#166658',paper:'#F4F1EA',ink:'#14161B'};
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function sizeCanvas(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c.setTransform(d,0,0,d,0,0);}
function frame(now){
  var r=cv.getBoundingClientRect();
  c.save();c.beginPath();c.rect(0,0,r.width,r.height);c.clip();F(c,r.width,r.height,still?1.1:Math.max(0,(now-t0)/1000),K);c.restore();
  if(!still)requestAnimationFrame(frame);
}
sizeCanvas();addEventListener('resize',sizeCanvas);requestAnimationFrame(frame);
})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
