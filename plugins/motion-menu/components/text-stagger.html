<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>텍스트 스태거 등장 Text Reveal (Stagger) — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ts{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:9px;padding-left:28px}
  .ts span{font:800 22px system-ui;color:#E7D6BC;animation:tsr 3s cubic-bezier(.16,1,.3,1) infinite}
  .ts span:nth-child(2){animation-delay:.12s;color:#38BE86}
  .ts span:nth-child(3){animation-delay:.24s}
  @keyframes tsr{0%{opacity:0;transform:translateY(22px)}30%,100%{opacity:1;transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.ts span{animation:none;opacity:1;transform:none}}
</style>
<div class="ts"><span>한 줄</span><span>또 한 줄</span><span>마지막 줄</span></div>
<p class="cap">텍스트 스태거 등장 · 줄·단어가 0.1초 간격으로 차례차례 올라온다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
