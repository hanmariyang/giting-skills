<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>콤보 점수 Combo Score · 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .kn{display:block;width:calc(100% - 24px);height:170px;margin:12px;border-radius:12px;background:#141821}
</style>
<canvas class="kn" role="img" aria-label="콤보 점수 데모: 요청 문장의 값 그대로 움직인다"></canvas>
<p class="cap">콤보 점수 · 맞힐 때마다 점수가 「한 번 점수 × 배율」만큼 오르고, 배율 칩이 커지며 튄다.</p>
<script>(function(){
var TAU = Math.PI * 2;
var cl = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var io = function (t) { t = cl(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
var eo = function (t) { t = cl(t); return 1 - Math.pow(1 - t, 3); };
var back = function (t) { t = cl(t); var s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
var seg = function (t, a, d) { return cl((t - a) / d); };
var bgc = function (c, w, h, col) { c.fillStyle = col; c.fillRect(0, 0, w, h); };
var NFONT = function (px, wt) { return (wt || 800) + ' ' + Math.round(px) + 'px -apple-system,"Apple SD Gothic Neo",system-ui,sans-serif'; };
var say = function (c, s, x, y, font, col, al) { c.font = font; c.fillStyle = col; c.textAlign = al || 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y); };
var sw = function (c, s, font) { c.font = font; return c.measureText(s).width; };
var rbox = function (c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); };
var comma = function (v) { return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
var SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
var F=function (c, w, h, t, V, k) {
    bgc(c, w, h, k.ink);
    var mx = Math.round(V.max), step = .55, L = .4 + mx * step + 1.4, p = t % L, n = Math.min(mx, Math.max(0, Math.floor((p - .4) / step) + 1)), score = 0;
    for (var i = 1; i <= n; i++) score += V.hit * i;
    var since = p - .4 - (n - 1) * step, pop = n ? back(seg(since, 0, .25)) : 0;
    say(c, 'SCORE', w * .36, h * .26, NFONT(10, 800), k.sub);
    c.save(); c.translate(w * .36, h * .52); var b = n ? 1 + .08 * (1 - seg(since, 0, .2)) : 1; c.scale(b, b); say(c, comma(score), 0, 0, NFONT(h * .26, 900), k.paper); c.restore();
    if (n) { c.save(); c.translate(w * .78, h * .48); c.scale(pop * (1 + n * .06), pop * (1 + n * .06)); say(c, '×' + n, 0, 0, NFONT(h * .2, 900), '#F5C542'); say(c, 'COMBO', 0, h * .14, NFONT(9, 800), '#F5C542'); c.restore(); }
    if (n && since < .35) say(c, '+' + comma(V.hit * n), w * .36 + 70, h * .3 - 16 * seg(since, 0, .35), NFONT(12, 800), k.green);
  };
var V={"hit":100,"max":5},K={"ink":"#141821","paper":"#F4F1EA","sub":"#8b93a1","acc":"#E07A3F","acc2":"#7a5af0","purple":"#7a5af0","card":"#E7D6BC","green":"#38BE86","pink":"#E8506E"},STILL=2.4;
var cv=document.querySelector('canvas.kn'),c=cv.getContext('2d');
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function sizeCanvas(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c.setTransform(d,0,0,d,0,0);}
function draw(now){var r=cv.getBoundingClientRect();c.save();c.beginPath();c.rect(0,0,r.width,r.height);c.clip();F(c,r.width,r.height,still?STILL:Math.max(0,(now-t0)/1000),V,K);c.restore();}
function frame(now){draw(now);if(!still)requestAnimationFrame(frame);}
addEventListener('message',function(e){var d=e.data&&e.data.mok;if(!d)return;for(var k in d)if(k in V&&isFinite(+d[k]))V[k]=+d[k];t0=performance.now();if(still)draw(t0);});
sizeCanvas();addEventListener('resize',function(){sizeCanvas();if(still)draw(performance.now());});requestAnimationFrame(frame);
})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
