<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>원 아이리스 Circle Iris — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .iw{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#E7D6BC}
  .iwb{position:absolute;inset:0;background:#1A8F63;display:flex;align-items:center;justify-content:center;font:700 19px system-ui;color:#fff;clip-path:circle(0% at 50% 50%);animation:iw 3s ease-in-out infinite}
  @keyframes iw{0%,20%{clip-path:circle(0% at 50% 50%)}55%,100%{clip-path:circle(75% at 50% 50%)}}
  @media(prefers-reduced-motion:reduce){.iwb{animation:none;clip-path:circle(75% at 50% 50%)}}
</style>
<div class="iw"><div class="iwb">화면 B</div></div>
<p class="cap">원 아이리스 ·『원 팝 전환』 · 원이 가운데서 커지며 다음 화면을 연다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
