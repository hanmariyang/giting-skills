<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RGB 분리 RGB Split — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .rs{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#0c0f15;display:flex;align-items:center;justify-content:center}
  .rst{position:relative;font:800 40px system-ui;letter-spacing:.04em}
  .rst span{position:absolute;left:0;top:0;mix-blend-mode:screen}
  .rsk{color:#E7D6BC}
  .rsr{color:#ff3b3b;animation:rsr 2.6s ease-in-out infinite}
  .rsb{color:#3b7bff;animation:rsb 2.6s ease-in-out infinite}
  @keyframes rsr{0%,20%,80%,100%{transform:translateX(0)}45%,55%{transform:translateX(-7px)}}
  @keyframes rsb{0%,20%,80%,100%{transform:translateX(0)}45%,55%{transform:translateX(7px)}}
  @media(prefers-reduced-motion:reduce){.rsr{transform:translateX(-4px)}.rsb{transform:translateX(4px)}.rsr,.rsb{animation:none}}
</style>
<div class="rs"><div class="rst"><span class="rsr">MOTION</span><span class="rsb">MOTION</span><span class="rsk">MOTION</span></div></div>
<p class="cap">RGB 분리(색수차) · 색 채널이 어긋났다 다시 모인다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
