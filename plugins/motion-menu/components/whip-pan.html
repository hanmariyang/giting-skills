<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>휩 팬 Whip Pan — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .wp{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}

<div class="wp"><div class="wpr"><div class="wa">화면 1</div><div class="wb">화면 2</div></div></div>
