<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>타입온 Type-on — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .to{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .tol{font:700 26px var(--mono,'JetBrains Mono',ui-monospace,monospace);color:#E7D6BC;white-space:nowrap;overflow:hidden;border-right:3px solid #38BE86;width:14ch;animation:tow 3.4s steps(14,end) infinite,toc .7s step-end infinite}
  @keyframes tow{0%{width:0}70%,100%{width:14ch}}
  @keyframes toc{50%{border-color:transparent}}
  @media(prefers-reduced-motion:reduce){.tol{animation:toc .7s step-end infinite;width:14ch}}
</style>
<div class="to"><div class="tol">Hello, world!</div></div>
<p class="cap">타입온 · 글자가 한 자씩 타자 치듯 나타난다 (커서 깜빡임)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
