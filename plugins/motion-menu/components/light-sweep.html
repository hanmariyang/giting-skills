<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>라이트 스윕 Light Sweep — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ls{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .lsl{position:relative;width:180px;height:60px;border-radius:12px;background:linear-gradient(#2a3550,#1b2334);overflow:hidden;display:flex;align-items:center;justify-content:center;font:800 22px system-ui;color:#E7D6BC}
  .lsl::after{content:"";position:absolute;top:-20%;left:-40%;width:40%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);animation:ls 2.6s ease-in-out infinite}
  @keyframes ls{0%,55%{left:-40%}80%,100%{left:120%}}
  @media(prefers-reduced-motion:reduce){.lsl::after{animation:none;left:50%}}
</style>
<div class="ls"><div class="lsl">LOGO</div></div>
<p class="cap">라이트 스윕(샤인) · 하이라이트가 로고 표면을 미끄러져 지나간다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
