<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>페데스탈 Pedestal — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st5{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .f5,.n5{position:absolute;left:0;right:0;top:0;height:200%}
  .f5{background:radial-gradient(circle at 70% 20%,#39506a 0 9px,transparent 10px) 0 0/90px 90px;animation:ped 4s linear infinite alternate}
  .n5{background:radial-gradient(circle at 30% 15%,#4fb8e8 0 13px,transparent 14px) 0 0/70px 70px;animation:ped2 4s linear infinite alternate}
  @keyframes ped{from{transform:translateY(-16%)}to{transform:translateY(0)}}
  @keyframes ped2{from{transform:translateY(-38%)}to{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.f5,.n5{animation:none}}
</style>
<div class="st5"><div class="f5"></div><div class="n5"></div></div>
<p class="cap">페데스탈 · 몸이 위아래로 이동. 가까운 게 더 많이(≠틸트)</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
