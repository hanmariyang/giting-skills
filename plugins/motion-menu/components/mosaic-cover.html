<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모자이크 가리기 Mosaic Cover · 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .bg{display:block;width:calc(100% - 24px);height:170px;margin:12px;border-radius:12px;background:#14161B}
</style>
<canvas class="bg" role="img" aria-label="모자이크 가리기 데모: 소셜 오버레이 장면"></canvas>
<p class="cap">모자이크 가리기 · 점선 네모로 고른 자리가 큰 네모 칸으로 뭉개져 가려지고 옆에 「가림」 칩이 붙는다.</p>
<script>(function(){
var TAU = Math.PI * 2;
var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var eo = function (t) { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
var io = function (t) { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
var back = function (t) { t = clamp(t); var s = 1.7; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
var lerp = function (a, b, t) { return a + (b - a) * t; };
var lerpC = function (a, b, t) { return '#' + [1, 3, 5].map(function (i) { return Math.round(parseInt(a.slice(i, i + 2), 16) * (1 - t) + parseInt(b.slice(i, i + 2), 16) * t).toString(16).padStart(2, '0'); }).join(''); };
var hash = function (i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
var P8 = function (t) { var p = t % 8; return p < 0 ? p + 8 : p; };
var seg = function (t, a, d) { return clamp((P8(t) - a) / d); };
var outA = function (t) { return 1 - clamp((P8(t) - 7.2) / .8); };
var SANS = '-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif';
var rrect = function (c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2))); };
var disc = function (c, x, y, r) { if (r > .2) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); } };
var say = function (c, s, x, y, px, col, al, wt) { c.font = (wt || 700) + ' ' + px + 'px ' + SANS; c.fillStyle = col; c.textAlign = al || 'center'; c.textBaseline = 'middle'; c.fillText(s, x, y); };
var sayW = function (c, s, px, wt) { c.font = (wt || 700) + ' ' + px + 'px ' + SANS; return c.measureText(s).width; };
// 영상 자리: 흐린 그라디언트와 둥근 빛 두 개(사진 대신)
var scene = function (c, w, h, k) {
  var g = c.createLinearGradient(0, 0, w, h); g.addColorStop(0, lerpC(k.deep, '#2A2F3A', .5)); g.addColorStop(1, '#1B1E25'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = 'rgba(255,255,255,.05)'; disc(c, w * .22, h * .3, h * .5); disc(c, w * .8, h * .85, h * .45);
};
var heartPath = function (c, x, y, s) { c.beginPath(); c.moveTo(x, y + s * .35); c.bezierCurveTo(x - s * 1.1, y - s * .35, x - s * .45, y - s * 1.05, x, y - s * .45); c.bezierCurveTo(x + s * .45, y - s * 1.05, x + s * 1.1, y - s * .35, x, y + s * .35); c.closePath(); };
var chip = function (c, s, cx, cy, px, bg, fg, padX) { var w = sayW(c, s, px) + padX * 2, hh = px * 2.1; rrect(c, cx - w / 2, cy - hh / 2, w, hh, hh / 2); c.fillStyle = bg; c.fill(); say(c, s, cx, cy + px * .04, px, fg); return w; };
var avatar = function (c, x, y, r, col) { c.fillStyle = col; disc(c, x, y, r); c.fillStyle = 'rgba(255,255,255,.85)'; disc(c, x, y - r * .2, r * .35); c.beginPath(); c.ellipse(x, y + r * .55, r * .55, r * .35, 0, Math.PI, TAU); c.fill(); };
var bgc0 = function (c, w, h) { c.fillStyle = '#1B1E25'; c.fillRect(0, 0, w, h); };
var bubble = function (c, x, y, bw, bh, col, tail) { rrect(c, x, y, bw, bh, bh * .45); c.fillStyle = col; c.fill(); c.beginPath(); if (tail === 'l') { c.moveTo(x + bh * .3, y + bh * .7); c.lineTo(x - bh * .05, y + bh * 1.02); c.lineTo(x + bh * .7, y + bh * .9); } else { c.moveTo(x + bw - bh * .3, y + bh * .7); c.lineTo(x + bw + bh * .05, y + bh * 1.02); c.lineTo(x + bw - bh * .7, y + bh * .9); } c.closePath(); c.fill(); };
var pinAt = function (c, x, y, s, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y - s * 1.8, s, Math.PI * .85, Math.PI * .15); c.lineTo(x, y); c.closePath(); c.fill(); c.fillStyle = '#FFFFFF'; disc(c, x, y - s * 1.8, s * .42); };
var F=function (c, w, h, t, k) {
  scene(c, w, h, k); c.globalAlpha = outA(t);
  var rw = h * .5, rh = h * .32, x0 = w * .5 - rw / 2, y0 = h * .3, sel = eo(seg(t, .4, .45)), mz = eo(seg(t, 1.0, .4));
  if (!k.photo) { rrect(c, x0 + rw * .08, y0 + rh * .18, rw * .84, rh * .64, h * .03); c.fillStyle = '#F4F1EA'; c.fill(); say(c, '12가 3456', w * .5, y0 + rh * .5, h * .09, '#16181D', 'center', 900); }
  if (mz > 0) {
    var m = c.getTransform(), bs = lerp(h * .02, h * .055, mz), cols = Math.ceil(rw / bs), rows = Math.ceil(rh / bs), cl = [];
    for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) { var sx = x0 + (i + .5) * bs, sy = y0 + Math.min(rh - 1, (j + .5) * bs); var px = c.getImageData(Math.round(m.a * sx + m.e), Math.round(m.d * sy + m.f), 1, 1).data; cl.push('rgb(' + px[0] + ',' + px[1] + ',' + px[2] + ')'); }
    var q = 0; for (var jj = 0; jj < rows; jj++) for (var ii = 0; ii < cols; ii++) { c.fillStyle = cl[q++]; c.fillRect(x0 + ii * bs, y0 + jj * bs, Math.min(bs, rw - ii * bs) + .5, Math.min(bs, rh - jj * bs) + .5); }
  }
  if (sel > 0 && P8(t) < 1.4) { c.globalAlpha = outA(t) * (1 - seg(t, 1.1, .3)); c.strokeStyle = '#FFFFFF'; c.lineWidth = h * .008; c.setLineDash([h * .025, h * .02]); c.strokeRect(x0, y0, rw * sel, rh * sel); c.setLineDash([]); c.globalAlpha = outA(t); }
  var l = back(seg(t, 1.5, .35)); if (l > 0) { c.save(); c.translate(x0 + rw, y0 - h * .02); c.scale(l, l); chip(c, '가림', 0, 0, h * .05, 'rgba(20,22,27,.85)', '#FFFFFF', h * .05); c.restore(); }
  c.globalAlpha = 1;
};
var cv=document.querySelector('canvas.bg'),c=cv.getContext('2d'),K={acc:'#7B5CE0',deep:'#4d3d87',paper:'#F4F1EA',ink:'#14161B'};
var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now();
function sizeCanvas(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);c.setTransform(d,0,0,d,0,0);}
function frame(now){
  var r=cv.getBoundingClientRect();
  c.save();c.beginPath();c.rect(0,0,r.width,r.height);c.clip();F(c,r.width,r.height,still?5:Math.max(0,(now-t0)/1000),K);c.restore();
  if(!still)requestAnimationFrame(frame);
}
sizeCanvas();addEventListener('resize',sizeCanvas);requestAnimationFrame(frame);
})();</script>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
