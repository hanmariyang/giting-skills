<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>장면 전환 Whip Pan+Motion Blur — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .rt{position:relative;height:200px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .rtr{position:absolute;inset:0;display:flex;width:200%;animation:rt 2.8s cubic-bezier(.8,0,.2,1) infinite}
  .rtr>div{flex:0 0 50%;display:flex;align-items:center;justify-content:center;font:700 22px system-ui;color:#0c0f15}
  .rt1{background:#E7D6BC}.rt2{background:#E07A3F}
  @keyframes rt{0%,36%{transform:translateX(0);filter:blur(0)}50%{filter:blur(8px)}46%,100%{transform:translateX(-50%);filter:blur(0)}}
  @media(prefers-reduced-motion:reduce){.rtr{animation:none}}
</style>
<div class="rt"><div class="rtr"><div class="rt1">컷 A</div><div class="rt2">컷 B</div></div></div>
<p class="cap">장면 전환 · 휩 팬으로 넘기고 그 구간에만 모션 블러</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
