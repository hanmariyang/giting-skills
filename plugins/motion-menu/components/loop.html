<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>심리스 루프 Seamless Loop — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .lo{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .lor{width:74px;height:74px;border-radius:50%;border:8px solid #243049;border-top-color:#38BE86;animation:lo 1.1s linear infinite}
  @keyframes lo{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){.lor{animation:none}}
</style>
<div class="lo"><div class="lor"></div></div>
<p class="cap">심리스 루프 · 끝과 처음이 이어져 끊김 없이 반복된다. ≠ 앞뒤로 왕복하는 핑퐁 루프</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
