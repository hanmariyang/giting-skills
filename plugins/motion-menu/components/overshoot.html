<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오버슈트 Overshoot — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .ov{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821;display:flex;align-items:center;justify-content:center}
  .ovc{width:60px;height:60px;border-radius:12px;background:#E07A3F;animation:ov 2.4s cubic-bezier(.34,1.7,.5,1) infinite}
  @keyframes ov{0%{transform:scale(.4)}60%,100%{transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){.ovc{animation:none}}
</style>
<div class="ov"><div class="ovc"></div></div>
<p class="cap">오버슈트 · 목표(100%)를 살짝 지나쳐 110%까지 갔다 돌아온다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
