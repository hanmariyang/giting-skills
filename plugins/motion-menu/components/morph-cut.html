<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>모프 컷 Morph Cut — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .mo{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#1b2130;display:flex;align-items:center;justify-content:center}
  .mof{position:absolute;width:70px;height:84px;border-radius:40px 40px 34px 34px;background:#E7D6BC}
  .mof.a{animation:moa 2.8s ease-in-out infinite}
  .mof.b{background:#cdbfa6;animation:mob 2.8s ease-in-out infinite}
  @keyframes moa{0%,35%{opacity:1;transform:translateX(0) rotate(0)}50%,100%{opacity:0;transform:translateX(7px) rotate(3deg)}}
  @keyframes mob{0%,35%{opacity:0;transform:translateX(-7px) rotate(-3deg)}50%,100%{opacity:1;transform:translateX(0) rotate(0)}}
  @media(prefers-reduced-motion:reduce){.mof{animation:none}.mof.b{opacity:1}}
</style>
<div class="mo"><div class="mof a"></div><div class="mof b"></div></div>
<p class="cap">모프 컷 · 두 테이크(얼굴)를 보간해 블렌딩, 점프컷 자국을 메운다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
