<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>틸트 Tilt — 모션 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}.cap{color:#8b93a1;font-size:11.5px;text-align:center;margin:8px 12px 12px;line-height:1.5}</style></head><body>
<style>
  .st2{position:relative;height:170px;margin:12px;border-radius:12px;overflow:hidden;background:#141821}
  .sc2{position:absolute;left:0;right:0;top:0;height:200%;background:
    radial-gradient(circle at 30% 15%,#4fb8e855 0 7px,transparent 8px),
    radial-gradient(circle at 70% 80%,#E07A3F55 0 7px,transparent 8px),
    linear-gradient(90deg,#1b2130 1px,transparent 1px) 0 0/36px 36px,
    linear-gradient(#1b2130 1px,transparent 1px) 0 0/36px 36px,#141821;
    animation:tilt 3.6s ease-in-out infinite alternate}
  @keyframes tilt{from{transform:translateY(-30%)}to{transform:translateY(0)}}
  @media(prefers-reduced-motion:reduce){.sc2{animation:none}}
</style>
<div class="st2"><div class="sc2"></div></div>
<p class="cap">틸트 · 제자리에서 위아래로. 아래에서 위로 올려다본다</p>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
