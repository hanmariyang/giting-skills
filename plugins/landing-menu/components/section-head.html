<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>섹션 헤더 Section Header — 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .sh { --ink:#1a1b1f; --mut:#6b6c74; --acc:#3a5bd9; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fff; }
  .sh .wrap { max-width:640px; margin:0 auto; padding:48px 24px; text-align:center; }
  .sh .eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); font-weight:700; }
  .sh h2 { font-size:clamp(24px,4.5vw,34px); font-weight:800; letter-spacing:-.03em; margin:12px 0 0; }
  .sh p { font-size:15px; color:var(--mut); margin:12px 0 0; line-height:1.6; }
  .sh .cap { margin:20px 0 0; font-size:11.5px; color:#a9aab0; }
</style>
<section class="sh"><div class="wrap">
  <div class="eyebrow">기능</div>
  <h2>필요한 것만, 정확히</h2>
  <p>각 섹션 위에 라벨·제목·부제를 묶어 얹으면 페이지에 리듬이 생긴다.</p>
  <div class="cap">정렬(왼쪽/가운데)은 페이지 전체에서 하나로 통일한다.</div>
</div></section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
