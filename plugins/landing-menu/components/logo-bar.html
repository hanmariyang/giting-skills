<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>로고 바 Logo Bar — 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .lgb { --mut:#8a8b92; --line:#ececed; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fff; }
  .lgb .wrap { max-width:900px; margin:0 auto; padding:36px 24px; text-align:center; }
  .lgb .lab { font-size:12px; letter-spacing:.1em; color:var(--mut); text-transform:uppercase; }
  .lgb .row { margin:20px 0 0; display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:18px 40px; }
  .lgb .logo { display:flex; align-items:center; gap:8px; color:#b3b4ba; font-weight:800; font-size:17px; letter-spacing:-.02em; filter:grayscale(1); opacity:.85; }
  .lgb .logo .m { width:20px; height:20px; border-radius:5px; background:#c8c9ce; }
  .lgb .cap { margin:18px 0 0; font-size:11px; color:#b7b8bd; }
</style>
<section class="lgb"><div class="wrap">
  <div class="lab">이런 곳에서 씁니다</div>
  <div class="row">
    <span class="logo"><span class="m"></span>Northwind</span>
    <span class="logo"><span class="m"></span>Acme</span>
    <span class="logo"><span class="m"></span>Loop</span>
    <span class="logo"><span class="m"></span>Vertex</span>
    <span class="logo"><span class="m"></span>Kite</span>
    <span class="logo"><span class="m"></span>Slate</span>
  </div>
  <div class="cap">실제 사용처 로고로 교체. 흑백·저채도로 통일해 히어로를 안 이긴다.</div>
</div></section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
