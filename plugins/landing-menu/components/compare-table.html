<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>비교표 Comparison Table — 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .ct { --ink:#1a1b1f; --mut:#6b6c74; --line:#e7e7ea; --acc:#3a5bd9; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fff; }
  .ct .wrap { max-width:720px; margin:0 auto; padding:44px 24px; }
  .ct table { width:100%; border-collapse:collapse; font-size:14px; }
  .ct th, .ct td { padding:12px 14px; border-bottom:1px solid var(--line); text-align:left; }
  .ct thead th { font-size:12px; color:var(--mut); font-weight:700; }
  .ct thead th.us { color:var(--acc); }
  .ct td.c { text-align:center; }
  .ct .y { color:var(--acc); font-weight:800; }
  .ct .n { color:#c3c4c9; }
  .ct tbody td:first-child { color:var(--ink); }
</style>
<section class="ct"><div class="wrap"><table>
  <thead><tr><th>기능</th><th class="c us">우리</th><th class="c">대안</th></tr></thead>
  <tbody>
    <tr><td>로컬 실행</td><td class="c y">✓</td><td class="c n">–</td></tr>
    <tr><td>MCP 연동</td><td class="c y">✓</td><td class="c n">–</td></tr>
    <tr><td>업로드 없음</td><td class="c y">✓</td><td class="c n">–</td></tr>
    <tr><td>오픈소스</td><td class="c y">✓</td><td class="c n">–</td></tr>
  </tbody>
</table></div></section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
