<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FAQ FAQ — 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .fq { --ink:#1a1b1f; --mut:#6b6c74; --line:#e7e7ea; --acc:#3a5bd9; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fff; }
  .fq .wrap { max-width:680px; margin:0 auto; padding:44px 24px; }
  .fq details { border-bottom:1px solid var(--line); }
  .fq summary { padding:16px 0; font-size:15px; font-weight:600; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; color:var(--ink); }
  .fq summary::-webkit-details-marker { display:none; }
  .fq summary:after { content:"+"; color:var(--acc); font-weight:700; font-size:20px; }
  .fq details[open] summary:after { content:"–"; }
  .fq p { padding:0 0 16px; margin:0; font-size:14px; color:var(--mut); line-height:1.65; }
</style>
<section class="fq"><div class="wrap">
  <details open><summary>설치가 어렵나요?</summary><p>한 줄이면 됩니다. 별도 계정이나 설정 없이 바로 붙습니다.</p></details>
  <details><summary>데이터는 어디에 저장되나요?</summary><p>기기 안에만 저장됩니다. 서버로 올라가지 않습니다.</p></details>
  <details><summary>오프라인에서 되나요?</summary><p>네. 네트워크 없이 그대로 작동합니다.</p></details>
  <details><summary>가격은 어떻게 되나요?</summary><p>기본 기능은 무료이고, 고급 기능은 Pro에서 제공합니다.</p></details>
  <details><summary>취소할 수 있나요?</summary><p>언제든 가능합니다. 위약금 없습니다.</p></details>
</div></section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
