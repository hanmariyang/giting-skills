<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텍스트 히어로 Text Hero — 랜딩 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
</style>
</head>
<body>
<style>
  .htx { --ink:#1a1b1f; --mut:#6b6c74; --line:#e7e7ea; --acc:#3a5bd9; --acc-ink:#fff;
    font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; color:var(--ink); background:#fff; }
  .htx .wrap { max-width:820px; margin:0 auto; padding:64px 24px 56px; }
  .htx .eyebrow { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--acc); font-weight:700; }
  .htx h1 { font-size:clamp(30px,6vw,52px); line-height:1.12; letter-spacing:-.03em; font-weight:800; margin:16px 0 0; max-width:16ch; }
  .htx p { font-size:clamp(15px,2.4vw,18px); color:var(--mut); line-height:1.65; margin:18px 0 0; max-width:48ch; }
  .htx .cta { margin:28px 0 0; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .htx .btn { background:var(--acc); color:var(--acc-ink); border:0; border-radius:10px; padding:13px 22px; font-size:15px; font-weight:700; cursor:pointer; }
  .htx .lnk { color:var(--ink); font-weight:600; font-size:14px; text-decoration:none; border-bottom:1.5px solid var(--line); }
  .htx .note { margin:36px 0 0; font-size:11.5px; color:#a9aab0; border-top:1px dashed var(--line); padding-top:12px; }
</style>
<section class="htx"><div class="wrap">
  <div class="eyebrow">텍스트 히어로</div>
  <h1>던진 한 줄이, 끝난 일이 됩니다</h1>
  <p>메시지가 강하면 비주얼이 없어도 된다. 큰 카피 한 줄과 그것을 구체화하는 부제, 그리고 다음 행동 하나로 첫 화면을 연다.</p>
  <div class="cta"><button class="btn">시작하기</button><a class="lnk" href="#">어떻게 되는지 보기</a></div>
  <div class="note">색·폰트·간격은 이 데모가 아니라 제품 design-brief에서 온다. 이 섹션은 구조(왼쪽 정렬·카피/부제/CTA 하나)만 보여 준다.</div>
</div></section>
<script>
document.addEventListener('click', function (e) { var a = e.target.closest('a[href="#"]'); if (a) e.preventDefault(); });
</script>
</body>
</html>
