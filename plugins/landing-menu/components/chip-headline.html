<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>칩 머리 제목 Chip Headline · 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .ch { --ink:#1a1b1f; --mut:#6b6c74; --acc:#3a5bd9; --pn:#f3f6ff; --hl:#ffd84d; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--pn); color:var(--ink); text-align:center; padding:44px 22px 40px; }
  .ch .chip { display:inline-block; font-size:13px; font-weight:700; color:var(--acc); background:#fff; border-radius:999px; padding:6px 15px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  .ch h2 { margin:16px auto 12px; font-size:clamp(26px,6vw,40px); line-height:1.22; letter-spacing:-.035em; font-weight:800; word-break:keep-all; max-width:16em; }
  .ch h2 em { font-style:normal; background:linear-gradient(transparent 58%,var(--hl) 58%); }
  .ch h2 i { font-style:normal; color:var(--acc); }
  .ch p { margin:0 auto; max-width:30em; font-size:15px; line-height:1.65; color:var(--mut); word-break:keep-all; }
  .ch p b { color:var(--ink); }
</style>
<section class="ch">
  <span class="chip">자동 정리</span>
  <h2>사진만 넣으면<br>달력이 <em>저절로</em> <i>채워져요</i></h2>
  <p>찍은 날짜를 읽어 그날 칸에 넣어요.<br><b>고를 것도, 옮길 것도 없어요.</b></p>
</section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
