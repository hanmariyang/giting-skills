<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>실물 셋 Result Trio · 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .rt { --ink:#1a1b1f; --mut:#6b6c74; --acc:#3a5bd9; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#fff; padding:30px 20px; }
  .rt .g { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; max-width:820px; margin:0 auto; }
  @media (max-width:600px){ .rt .g { grid-template-columns:1fr; max-width:320px; } }
  .rt figure { margin:0; text-align:center; }
  .rt .ph { height:200px; border-radius:16px; background:#16171b; color:#ff6a2b; display:flex; align-items:center; justify-content:center; padding:16px; font-weight:900; letter-spacing:-.04em; line-height:1.05; box-shadow:0 8px 24px rgba(23,23,27,.12); word-break:keep-all; }
  .rt figcaption { margin-top:10px; font-size:14px; font-weight:700; }
  .rt figcaption b { color:var(--acc); }
  .rt .cap { text-align:center; font-size:13px; color:var(--mut); margin:16px 0 0; }
</style>
<section class="rt">
  <div class="g">
    <figure><div class="ph" style="font-size:34px">새 학기</div><figcaption><b>짧게</b> 두 어절</figcaption></figure>
    <figure><div class="ph" style="font-size:28px">새 학기<br>준비물 정리</div><figcaption><b>원래</b> 글</figcaption></figure>
    <figure><div class="ph" style="font-size:19px">새 학기 준비물을<br>과목별로 나눠<br>한 장에 정리했어요</div><figcaption><b>길게</b> 크기 70%</figcaption></figure>
  </div>
  <p class="cap">같은 것을 조건 하나만 바꿔 세 번. 설명 대신 결과가 말한다.</p>
</section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
