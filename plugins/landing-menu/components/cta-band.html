<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CTA 밴드 CTA Band — 랜딩 메뉴판</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#17171b;font-size:13.5px;background:#fff}</style></head><body>
<style>
  .cb { --acc:#3a5bd9; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#14203a; color:#fff; }
  .cb .wrap { max-width:760px; margin:0 auto; padding:56px 24px; text-align:center; }
  .cb h2 { font-size:clamp(22px,4vw,32px); font-weight:800; letter-spacing:-.02em; margin:0; }
  .cb p { color:#a9b4cc; font-size:15px; margin:12px 0 0; }
  .cb .row { margin:24px 0 0; display:flex; gap:14px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .cb .btn { background:#fff; color:#14203a; border:0; border-radius:10px; padding:13px 26px; font-size:15px; font-weight:700; cursor:pointer; }
  .cb .lnk { color:#cdd6e8; text-decoration:none; font-size:14px; font-weight:600; }
</style>
<section class="cb"><div class="wrap">
  <h2>오늘 바로 시작하세요</h2>
  <p>설치 한 줄이면 됩니다. 신용카드도, 계정도 필요 없어요.</p>
  <div class="row"><button class="btn">무료로 시작</button><a class="lnk" href="#">문서 보기 →</a></div>
</div></section>
<script>document.addEventListener('click',function(e){var a=e.target.closest('a[href="#"]');if(a)e.preventDefault();});</script>
</body></html>
