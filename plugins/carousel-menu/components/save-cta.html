<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>저장 유도 Save CTA · 캐러셀 메뉴판</title><style>body{margin:0;background:#f6f5f2}</style></head><body>
<style>

  .cap{color:#9a9aa4;font-size:11px;text-align:center;margin:0 12px 12px;line-height:1.5}
