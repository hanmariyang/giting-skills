<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>전/후 비교 Before / After · 캐러셀 메뉴판</title><style>body{margin:0;background:#f6f5f2}</style></head><body>
<style>
  .cs{--ink:#17171B;--sub:#6B6C74;--line:#E6E4DF;--wash:#F4F2EC;--acc:#E5482A;--hl:#FFD9CF;--card:#FFFFFF;
    width:360px;height:450px;margin:14px auto;position:relative;overflow:hidden;border-radius:6px;background:var(--card);color:var(--ink);
    box-shadow:0 1px 0 #E2E0DA,0 14px 30px rgba(23,23,27,.12);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all;box-sizing:border-box}
  .cs *{box-sizing:border-box;margin:0}
  .cs .chip{position:absolute;left:22px;top:20px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:4px}
  .cs .pc{position:absolute;right:22px;bottom:16px;font-size:10px;color:#9A9BA3;font-variant-numeric:tabular-nums}
  .cs .hd{position:absolute;left:22px;bottom:16px;font-size:10px;font-weight:800;letter-spacing:.12em}
  .cs .t{font-size:25px;font-weight:800;line-height:1.22;letter-spacing:-.04em}
  .cs .s{font-size:12px;color:var(--sub);line-height:1.5}
  .cs .ex{position:absolute;right:22px;top:20px;font-size:9px;color:#A3A49C}
  .cs .hl{background:linear-gradient(transparent 58%,var(--hl) 58%)}
  .cs .ph{display:block;border-radius:8px;background:linear-gradient(160deg,#F2C9A0,#C9785A 55%,#5B3A33)}
  .cs .ph.b{background:linear-gradient(160deg,#B9D3E0,#6F95AB 60%,#2F4552)}.cs .ph.c{background:linear-gradient(160deg,#D9DDB6,#8FA36B 60%,#3E4A2C)}.cs .ph.d{background:linear-gradient(160deg,#E7D3E7,#A07BB0 60%,#43324E)}
  .cs .in{position:absolute;left:22px;right:22px}
  .cap{color:#9a9aa4;font-size:11px;text-align:center;margin:0 12px 12px;line-height:1.5}
</style>
<div class="cs" role="img" aria-label="전/후 비교 장 견본"><span class="chip">시리즈 · 03</span><span class="ex">예시</span><div class="in" style="top:54px;height:150px;background:var(--wash);border-radius:12px;padding:12px"><b style="font-size:11px;color:#A3A49C">전</b><div style="display:flex;gap:8px;margin-top:22px;justify-content:center"><span style="height:30px;width:72px;border-radius:7px;background:#BDBBB5;"></span><span style="height:30px;width:72px;border-radius:7px;background:#BDBBB5;"></span><span style="height:30px;width:72px;border-radius:7px;background:#BDBBB5;"></span></div><p class="s" style="text-align:center;margin-top:18px;font-size:11.5px;">버튼이 셋 다 같은 색이에요</p></div><div class="in" style="top:222px;height:150px;background:var(--wash);border-radius:12px;padding:12px"><b style="font-size:11px;color:var(--acc)">후</b><div style="display:flex;gap:8px;margin-top:22px;justify-content:center"><span style="height:30px;width:72px;border-radius:7px;background:var(--acc);"></span><span style="height:30px;width:72px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink)"></span><span style="height:30px;width:72px;border-radius:7px;background:#fff;box-shadow:inset 0 0 0 2px var(--ink)"></span></div><p class="s" style="text-align:center;margin-top:18px;font-size:11.5px;color:var(--ink);font-weight:700">신청하기 하나만 진하게</p></div><span class="pc">4 / 6</span></div>
<p class="cap">전/후 비교 · 1080×1350 장을 줄여 그린 견본. 색·글꼴은 예시예요.</p>
</body></html>
