<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>번호 리스트 Numbered List · 캐러셀 메뉴판</title><style>body{margin:0;background:#f6f5f2}</style></head><body>
<style>
  .cs{--ink:#17171B;--sub:#6B6C74;--line:#E6E4DF;--wash:#F4F2EC;--acc:#E5482A;--hl:#FFD9CF;--card:#FFFFFF;
    width:360px;height:450px;margin:14px auto;position:relative;overflow:hidden;border-radius:6px;background:var(--card);color:var(--ink);
    box-shadow:0 1px 0 #E2E0DA,0 14px 30px rgba(23,23,27,.12);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;word-break:keep-all;box-sizing:border-box}
  .cs *{box-sizing:border-box;margin:0}
  .cs .chip{position:absolute;left:22px;top:20px;background:var(--ink);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:4px}
  .cs .pc{position:absolute;right:22px;bottom:16px;font-size:10px;color:#9A9BA3;font-variant-numeric:tabular-nums}
  .cs .hd{position:absolute;left:22px;bottom:16px;font-size:10px;font-weight:800;letter-spacing:.12em}
  .cs .t{font-size:25px;font-weight:800;line-height:1.22;letter-spacing:-.04em}
  .cs .s{font-size:12px;color:var(--sub);line-height:1.5}
  .cs .ex{position:absolute;right:22px;top:20px;font-size:9px;color:#A3A49C}
  .cs .hl{background:linear-gradient(transparent 58%,var(--hl) 58%)}
  .cs .ph{display:block;border-radius:8px;background:linear-gradient(160deg,#F2C9A0,#C9785A 55%,#5B3A33)}
  .cs .ph.b{background:linear-gradient(160deg,#B9D3E0,#6F95AB 60%,#2F4552)}.cs .ph.c{background:linear-gradient(160deg,#D9DDB6,#8FA36B 60%,#3E4A2C)}.cs .ph.d{background:linear-gradient(160deg,#E7D3E7,#A07BB0 60%,#43324E)}
  .cs .in{position:absolute;left:22px;right:22px}
  .cap{color:#9a9aa4;font-size:11px;text-align:center;margin:0 12px 12px;line-height:1.5}
</style>
<div class="cs" role="img" aria-label="번호 리스트 장 견본"><span class="chip">시리즈 · 03</span><span class="ex">예시</span><div class="in" style="top:52px"><p class="t" style="font-size:19px">자주 쓰는 순서대로</p><div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);padding:11px 0"><b style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none">1</b><div><p style="font-size:13.5px;font-weight:800">항목 이름 1</p><p class="s" style="font-size:11px">설명은 회색으로 두 줄까지.</p></div></div><div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);padding:11px 0"><b style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none">2</b><div><p style="font-size:13.5px;font-weight:800">항목 이름 2</p><p class="s" style="font-size:11px">설명은 회색으로 두 줄까지.</p></div></div><div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);padding:11px 0"><b style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none">3</b><div><p style="font-size:13.5px;font-weight:800">항목 이름 3</p><p class="s" style="font-size:11px">설명은 회색으로 두 줄까지.</p></div></div><div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line);padding:11px 0"><b style="width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none">4</b><div><p style="font-size:13.5px;font-weight:800">항목 이름 4</p><p class="s" style="font-size:11px">설명은 회색으로 두 줄까지.</p></div></div></div><span class="pc">3 / 6</span></div>
