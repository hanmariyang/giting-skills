<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;font:16px/1.5 -apple-system,sans-serif;padding:16px;word-break:keep-all}
.fixed{height:44px;width:140px;overflow:hidden;white-space:nowrap;border:1px solid #ccc;border-radius:10px;background:#fff;font-size:15px}
.ok{padding:10px 16px;border-radius:10px;border:1px solid #ccc;background:#fff;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;height:72px;background:#16161a;color:#fff;display:flex;align-items:center;justify-content:center}
.low{position:absolute;left:16px;top:calc(100vh - 60px)}
</style></head><body>
<!-- 글자 키운 상태 시험용: 200% 에서 「장바구니 담기」 버튼 글자가 잘리고, 맨 아래 「약관 전체 보기」는 고정 바에 덮여 100% 에서도 안 눌린다 -->
<h1>지금 예약하세요</h1>
<p>주문하신 메뉴를 만들고 있어요. 도착 예정 시각은 오후 12시 29분입니다.</p>
<button class="fixed">장바구니 담기</button>
<button class="ok">다시 주문</button>
<div style="height:1200px"></div>
<button class="ok">약관 전체 보기</button>
<div class="bar"><button class="ok">결제하기</button></div>
</body></html>
