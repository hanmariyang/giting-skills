<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키보드 키 Kbd — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .kd { font-size: 13px; }
  kbd { display: inline-grid; place-items: center; min-width: 20px; height: 22px; padding: 0 5px; border: 1px solid #d4d4dd; border-bottom-width: 2px; border-radius: 5px; background: #fff; font-size: 11px; font-family: inherit; }
</style>
<div class="center"><div style="text-align:center"><p class="kd" style="margin:0">검색은 <kbd>&#8984;</kbd> <kbd>K</kbd></p><p class="cap">단축키를 키 모양으로 보여주는 것</p></div></div>
</body>
</html>
