<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후기 Testimonial — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .tm { width: 240px; border: 1px solid #e8e8ee; border-radius: 12px; padding: 14px 16px; background: #fff; }
  .tm .q { font-size: 12.5px; line-height: 1.6; }
  .tm .who { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .tm .av { width: 26px; height: 26px; border-radius: 50%; background: #17171b; color: #fff; display: grid; place-items: center; font-size: 11px; }
  .tm .who b { font-size: 11.5px; display: block; }
  .tm .who small { color: #9a9aa4; font-size: 10.5px; }
</style>
<div class="center"><figure class="tm" style="margin:0">
  <blockquote class="q" style="margin:0">"코딩 하나도 모르는데 이틀 만에 신청 페이지를 만들었어요."</blockquote>
  <figcaption class="who"><span class="av">김</span><span><b>김하나</b><small>대학생</small></span></figcaption>
</figure></div>
</body>
</html>
