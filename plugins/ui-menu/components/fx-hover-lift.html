<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호버로 떠오르기 Hover Lift · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .row { flex-wrap: nowrap; }
  .cd { width: 96px; border: 1px solid #e6e6ec; border-radius: 10px; padding: 8px; background: #fff; color: #17171b; text-decoration: none; transition: transform .2s ease-out, box-shadow .2s ease-out; cursor: pointer; }
  .cd:hover, .cd:focus-visible { transform: translateY(-5px); box-shadow: 0 12px 22px rgba(23,23,27,.12); outline: none; }
  .cd i { display: block; height: 54px; border-radius: 6px; }
  .cd b { display: block; font-size: 12px; margin-top: 7px; }
  @media (prefers-reduced-motion: reduce) { .cd { transition: box-shadow .2s; } .cd:hover, .cd:focus-visible { transform: none; } }
</style>
<div class="center"><div><div class="row">
  <a class="cd" href="#"><i style="background:#c9d3f3"></i><b>산 숙소</b></a>
  <a class="cd" href="#"><i style="background:#fbd3bf"></i><b>바다 숙소</b></a>
  <a class="cd" href="#"><i style="background:#2b2f4a"></i><b>별 보는 숙소</b></a>
</div><p class="cap">올리면 살짝 떠오르고 그림자가 짙어져요</p></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
