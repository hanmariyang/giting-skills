<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검색·필터 InputGroup+Combobox+Badge+ToggleGroup — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .se { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f7f8fa; padding: 14px; height: 100%; }
  .se * { box-sizing: border-box; }
  .se .bar { display: flex; align-items: center; border: 1px solid #e0e0e6; border-radius: 10px; background: #fff; padding: 0 12px; margin-bottom: 10px; }
  .se .bar span { color: #9a9aa4; }
  .se .bar input { flex: 1; border: 0; padding: 10px 8px; font-size: 13px; outline: none; }
  .se .chips { display: flex; gap: 6px; margin-bottom: 12px; }
  .se .chip { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: #17171b; color: #fff; }
  .se .chip.off { background: #eef0f3; color: #6b6b76; }
  .se .sort { margin-left: auto; display: flex; border: 1px solid #e0e0e6; border-radius: 8px; overflow: hidden; }
  .se .sort span { font-size: 11px; padding: 4px 10px; }
  .se .sort span.on { background: #17171b; color: #fff; }
  .se .res { background: #fff; border: 1px solid #e8e8ee; border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #6b6b76; }
  .se .ac { border: 1px solid #e8e8ee; border-radius: 8px; margin-top: 6px; background: #fff; font-size: 12px; }
  .se .ac div { padding: 7px 12px; border-bottom: 1px solid #f0f0f4; }
  .se .ac div:last-child { border: 0; }
</style>
<div class="se">
  <div class="bar"><span>🔍</span><input value="후드"><div class="ac" style="position:absolute"></div></div>
  <div class="ac">
    <div><b>후드</b>티</div><div><b>후드</b>집업</div>
  </div>
  <div class="chips" style="margin-top:10px"><span class="chip">남성 ✕</span><span class="chip off">신상</span>
    <span class="sort"><span class="on">인기순</span><span>최신순</span></span></div>
  <div class="res">312개 상품 · 필터: 남성</div>
</div>
<p class="cap">InputGroup + Combobox + Badge + ToggleGroup</p>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
