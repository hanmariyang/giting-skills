<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 업로더 File Upload — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .fu { width: 230px; border: 2px dashed #c9c9d4; border-radius: 10px; padding: 22px 14px; text-align: center; cursor: pointer; }
  .fu:hover { border-color: #17171b; }
  .fu b { font-size: 12.5px; display: block; }
  .fu small { color: #9a9aa4; font-size: 10.5px; }
</style>
<div class="center"><label class="fu"><input type="file" hidden><span style="font-size:16px">&#8679;</span><b>여기로 끌어다 놓으세요</b><small>이미지 · 최대 5MB</small></label></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
