<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>따라오는 헤더 Sticky Header · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .sc { height: 100vh; overflow-y: auto; }
  .hd { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(255,255,255,.92); backdrop-filter: blur(6px); transition: box-shadow .25s; }
  .hd.on { box-shadow: 0 1px 0 #e6e6ec, 0 6px 14px rgba(0,0,0,.06); }
  .hd b { font-size: 13px; }
  .hd nav { display: flex; gap: 12px; font-size: 12px; color: #55555f; }
  .body { padding: 10px 16px 300px; }
  .body .bar { margin-top: 12px; }
</style>
<div class="sc" id="sc">
  <header class="hd" id="hd"><b>산책일기</b><nav><span>기능</span><span>요금</span><span>문의</span></nav></header>
  <div class="body"><div class="bar" style="width:90%"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:62%"></div><div class="bar" style="width:78%"></div><p class="cap">내려도 헤더는 위에 남고, 아래에 그림자가 생겨요</p></div>
</div>
<script>
  (function () {
    var sc = document.getElementById('sc'), hd = document.getElementById('hd');
    sc.addEventListener('scroll', function () { hd.classList.toggle('on', sc.scrollTop > 4); }, { passive: true });
  })();
</script>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
