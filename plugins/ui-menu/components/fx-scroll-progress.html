<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크롤 진행 막대 Scroll Progress Bar — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .pr { position: fixed; top: 0; left: 0; height: 3px; width: 100%; background: #3f56c4; transform-origin: 0 50%; transform: scaleX(0); z-index: 3; }
  .sc { height: 100vh; overflow-y: auto; padding: 18px 18px 40px; }
  .sc h3 { margin: 0 0 12px; font-size: 15px; }
  .sc .bar { margin-top: 9px; }
</style>
<div class="pr" id="pr" role="progressbar" aria-label="읽은 정도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
<div class="sc" id="sc">
  <h3>처음 앱을 내는 사람의 일곱 밤</h3>
  <div class="bar" style="width:92%"></div><div class="bar" style="width:84%"></div><div class="bar" style="width:88%"></div><div class="bar" style="width:60%"></div>
  <div class="bar" style="width:90%;margin-top:18px"></div><div class="bar" style="width:76%"></div><div class="bar" style="width:86%"></div><div class="bar" style="width:52%"></div>
  <div class="bar" style="width:88%;margin-top:18px"></div><div class="bar" style="width:80%"></div><div class="bar" style="width:91%"></div><div class="bar" style="width:46%"></div>
  <div class="bar" style="width:84%;margin-top:18px"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:66%"></div>
  <p class="cap">위의 선이 읽은 만큼 늘어나요</p>
</div>
<script>
  (function () {
    var sc = document.getElementById('sc'), pr = document.getElementById('pr');
    sc.addEventListener('scroll', function () {
      var p = sc.scrollTop / (sc.scrollHeight - sc.clientHeight || 1);
      pr.style.transform = 'scaleX(' + p + ')'; pr.setAttribute('aria-valuenow', Math.round(p * 100));
    }, { passive: true });
  })();
</script>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
