<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부채처럼 펼치는 카드 Fan-out Card Stack · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .fan { position: relative; width: 120px; height: 150px; border: 0; background: none; padding: 0; cursor: pointer; }
  .fan:focus-visible { outline: 3px solid #17171b; outline-offset: 8px; border-radius: 14px; }
  .fan i { position: absolute; inset: 0; border-radius: 14px; box-shadow: 0 4px 14px rgba(23,23,27,.12); transform-origin: 50% 120%; transition: transform .45s cubic-bezier(.3,1.3,.5,1); display: grid; place-items: end start; padding: 10px; color: #fff; font-size: 12px; font-weight: 700; font-style: normal; }
  .fan i:nth-child(1) { background: #3f56c4; transform: translate(-6px, 6px); }
  .fan i:nth-child(2) { background: #2e9e6a; transform: translate(-2px, 2px); transition-delay: .05s; }
  .fan i:nth-child(3) { background: #e0733f; transform: translate(2px, -2px); transition-delay: .1s; }
  .fan i:nth-child(4) { background: #17171b; transform: translate(6px, -6px); transition-delay: .15s; }
  .fan[aria-expanded="true"] i:nth-child(1) { transform: translateX(-105px) rotate(-18deg); }
  .fan[aria-expanded="true"] i:nth-child(2) { transform: translateX(-35px) rotate(-6deg); }
  .fan[aria-expanded="true"] i:nth-child(3) { transform: translateX(35px) rotate(6deg); }
  .fan[aria-expanded="true"] i:nth-child(4) { transform: translateX(105px) rotate(18deg); }
  @media (prefers-reduced-motion: reduce) { .fan i { transition: none; } }
</style>
<div class="center"><div style="text-align:center">
  <button class="fan" id="fan" aria-expanded="false" aria-label="추천 카드 넷 펼치기"><i>산책</i><i>캠핑</i><i>전시</i><i>맛집</i></button>
  <p class="cap">누르면 부채처럼 펼쳐져요</p>
</div></div>
<script>
  document.getElementById('fan').addEventListener('click', function () { this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') !== 'true'); });
</script>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
