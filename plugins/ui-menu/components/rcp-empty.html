<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈 화면·로딩 Empty+Skeleton+Spinner — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .em { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f7f8fa; padding: 14px; height: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .em * { box-sizing: border-box; }
  .em .box { background: #fff; border: 1px solid #e8e8ee; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
  .em .lab { font-size: 10px; color: #9a9aa4; margin-bottom: 10px; font-family: ui-monospace, monospace; }
  .em .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; }
  .em .empty .ic { font-size: 26px; }
  .em .empty p { margin: 0; font-size: 12px; color: #9a9aa4; }
  .em .empty button { margin-top: 4px; font-size: 12px; padding: 6px 14px; background: #17171b; color: #fff; border: 0; border-radius: 8px; }
  .em .sk { display: grid; gap: 8px; }
  .em .sk i { display: block; background: #ececf1; border-radius: 6px; height: 12px; }
  .em .sk .sp { height: 44px; }
</style>
<div class="em">
  <div class="box"><div class="lab">데이터 없음</div>
    <div class="empty"><div class="ic">📭</div><p>아직 주문이 없어요</p><button>첫 주문 하러 가기</button></div>
  </div>
  <div class="box"><div class="lab">불러오는 중</div>
    <div class="sk"><i class="sp"></i><i></i><i style="width:80%"></i><i style="width:60%"></i></div>
  </div>
</div>
<p class="cap">Empty + Skeleton + Spinner</p>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
