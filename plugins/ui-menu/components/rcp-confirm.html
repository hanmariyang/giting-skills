<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확인·경고 AlertDialog+Button+Alert — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .cf { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f7f8fa; height: 100%; position: relative; padding: 14px; }
  .cf * { box-sizing: border-box; }
  .cf .list { background: #fff; border: 1px solid #e8e8ee; border-radius: 10px; padding: 12px; font-size: 12px; color: #9a9aa4; }
  .cf .overlay { position: absolute; inset: 0; background: rgba(23,23,27,.4); display: flex; align-items: center; justify-content: center; }
  .cf .dialog { background: #fff; border-radius: 14px; padding: 20px; width: 220px; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .cf .dialog h4 { margin: 0 0 6px; font-size: 15px; }
  .cf .dialog p { margin: 0 0 16px; font-size: 12px; color: #6b6b76; line-height: 1.5; }
  .cf .btns { display: flex; gap: 8px; }
  .cf .btn { flex: 1; padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 600; border: 1px solid #e0e0e6; background: #fff; }
  .cf .btn.d { background: #c4372b; color: #fff; border-color: #c4372b; }
</style>
<div class="cf">
  <div class="list">계정 설정 · 결제 정보 · 알림 · 회원 탈퇴</div>
  <div class="overlay">
    <div class="dialog">
      <h4>정말 탈퇴하시겠어요?</h4>
      <p>모든 데이터가 영구히 삭제되고 되돌릴 수 없습니다.</p>
      <div class="btns"><button class="btn">취소</button><button class="btn d">탈퇴</button></div>
    </div>
  </div>
</div>
<p class="cap">AlertDialog + Button + Alert (destructive)</p>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
