<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뒤집는 카드 Flip Card · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .fc { width: 190px; height: 130px; perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; }
  .fc:focus-visible { outline: 3px solid #17171b; outline-offset: 4px; border-radius: 14px; }
  .fc .in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,.1,.2,1); }
  .fc[aria-pressed="true"] .in { transform: rotateY(180deg); }
  .fc .f, .fc .b { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; align-content: center; gap: 4px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .fc .f { background: #fff; border: 1.5px solid #e0e0e8; font-size: 22px; font-weight: 800; color: #17171b; }
  .fc .b { background: #17171b; color: #fff; font-size: 14px; transform: rotateY(180deg); }
  .fc small { font-size: 11px; color: #9a9aa4; font-weight: 500; }
  @media (prefers-reduced-motion: reduce) { .fc .in { transition: none; } }
</style>
<div class="center"><div style="text-align:center">
  <button class="fc" id="fc" aria-pressed="false"><span class="in"><span class="f">serendipity<small>눌러서 뜻 보기</small></span><span class="b">뜻밖의 좋은 발견<small style="color:#9a9aa4">다시 누르면 앞면</small></span></span></button>
  <p class="cap">누르면 반 바퀴 돌아 뒷면이 나와요</p>
</div></div>
<script>
  document.getElementById('fc').addEventListener('click', function () { this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') !== 'true'); });
</script>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
