<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인풋 Input / Text Field — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .in1 { width: 220px; }
  .in1 label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 4px; }
  .in1 input { width: 100%; padding: 9px 11px; border: 1px solid #e0e0e8; border-radius: 8px; font-size: 13px; box-sizing: border-box; font-family: inherit; }
  .in1 input:focus { outline: 2px solid #17171b; border-color: transparent; }
</style>
<div class="center"><div class="in1"><label>이름</label><input placeholder="한 줄 입력칸"></div></div>
</body>
</html>
