<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>타임피커 Time Picker — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .tp2 { width: 200px; text-align: center; }
  .tp2 input { width: 100%; padding: 9px 11px; border: 1px solid #e0e0e8; border-radius: 8px; font-size: 13px; box-sizing: border-box; text-align: center; font-variant-numeric: tabular-nums; font-family: inherit; }
  .tp2 .hrs { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .tp2 .hrs button { border: 1px solid #e0e0e8; background: #fff; border-radius: 7px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .tp2 .hrs .on { border-color: #17171b; font-weight: 700; }
</style>
<div class="center"><div class="tp2"><input value="14 : 30" readonly aria-label="시간"><div class="hrs"><button>13</button><button class="on">14</button><button>15</button></div></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
