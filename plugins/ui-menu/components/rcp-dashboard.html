<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대시보드 Sidebar+Card+Chart+Table+Badge — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .db { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f7f8fa; display: flex; height: 100%; }
  .db * { box-sizing: border-box; }
  .db .side { width: 120px; background: #17171b; padding: 14px 10px; flex: none; }
  .db .side .l { color: #fff; font-weight: 800; font-size: 13px; margin-bottom: 14px; }
  .db .side a { display: block; color: #b9bac2; font-size: 12px; padding: 7px 8px; border-radius: 7px; text-decoration: none; }
  .db .side a.on { background: rgba(255,255,255,.12); color: #fff; }
  .db .main { flex: 1; padding: 14px; min-width: 0; }
  .db .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .db .stat { background: #fff; border: 1px solid #e8e8ee; border-radius: 10px; padding: 10px 12px; }
  .db .stat .k { font-size: 10px; color: #9a9aa4; }
  .db .stat .v { font-size: 18px; font-weight: 800; }
  .db .chart { background: #fff; border: 1px solid #e8e8ee; border-radius: 10px; padding: 12px; height: 78px; display: flex; align-items: flex-end; gap: 5px; }
  .db .chart i { flex: 1; background: #17171b; border-radius: 3px 3px 0 0; }
  .db .badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #eef6f0; color: #1f7a4d; }
</style>
<div class="db">
  <div class="side"><div class="l">Acme</div><a class="on">개요</a><a>주문</a><a>고객</a><a>설정</a></div>
  <div class="main">
    <div class="stats">
      <div class="stat"><div class="k">매출</div><div class="v">₩4.2M</div></div>
      <div class="stat"><div class="k">주문</div><div class="v">312</div></div>
      <div class="stat"><div class="k">상태 <span class="badge">정상</span></div><div class="v">99%</div></div>
    </div>
    <div class="chart"><i style="height:40%"></i><i style="height:65%"></i><i style="height:50%"></i><i style="height:80%"></i><i style="height:70%"></i><i style="height:95%"></i></div>
  </div>
</div>
<p class="cap">Sidebar + Card + Chart + Table + Badge</p>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
