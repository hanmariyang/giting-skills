<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로필 카드 Profile Card — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .pc { display: flex; gap: 10px; align-items: center; border: 1px solid #e8e8ee; border-radius: 999px; padding: 8px 10px; background: #fff; }
  .pc .av { width: 34px; height: 34px; border-radius: 50%; background: #17171b; color: #fff; display: grid; place-items: center; font-size: 13px; }
  .pc b { font-size: 12.5px; display: block; }
  .pc small { color: #9a9aa4; font-size: 10.5px; }
  .pc button { margin-left: 8px; border: 0; border-radius: 999px; background: #17171b; color: #fff; padding: 6px 14px; font-size: 11.5px; cursor: pointer; }
</style>
<div class="center"><div class="pc"><span class="av">쥬</span><span><b>이지우</b><small>AI 활용 콘텐츠</small></span><button>팔로우</button></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
