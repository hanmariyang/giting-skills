<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>떠오르는 라벨 Floating Label · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .fl { position: relative; width: 260px; }
  .fl input { width: 100%; padding: 16px 14px 8px; border: 1.5px solid #c9c9d4; border-radius: 10px; font-size: 14px; outline: none; background: #fff; transition: border-color .2s; }
  .fl label { position: absolute; left: 12px; top: 13px; padding: 0 4px; font-size: 14px; color: #9a9aa4; background: #fff; pointer-events: none; transform-origin: left top; transition: transform .2s ease-out, color .2s; }
  .fl input:focus { border-color: #e0733f; }
  .fl input:focus + label, .fl input:not(:placeholder-shown) + label { transform: translateY(-21px) scale(.79); color: #e0733f; }
  .fl input:not(:focus):not(:placeholder-shown) + label { color: #6b6b76; }
  @media (prefers-reduced-motion: reduce) { .fl label { transition: none; } }
</style>
<div class="center"><div><div class="fl"><input id="fle" type="email" placeholder=" " autocomplete="off"><label for="fle">이메일</label></div><p class="cap">누르면 이름이 위로 올라가요</p></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
