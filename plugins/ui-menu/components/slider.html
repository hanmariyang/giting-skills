<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슬라이더 Slider / Range — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .sd { width: 220px; }
  .sd .top { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 6px; }
  .sd .top b { font-variant-numeric: tabular-nums; }
  .sd input { width: 100%; accent-color: #17171b; }
  .sd .btm { display: flex; justify-content: space-between; color: #9a9aa4; font-size: 10px; }
</style>
<div class="center"><div class="sd">
  <div class="top"><span>예산</span><b id="v">45만원</b></div>
  <input type="range" min="0" max="100" value="45" oninput="document.getElementById('v').textContent = this.value + '만원'">
  <div class="btm"><span>0</span><span>100만원</span></div>
</div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
