<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하단 탭바 Bottom Navigation / Tab Bar — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .bd3 { flex: 1; padding: 12px 14px; }
  .bn { display: flex; border-top: 1px solid #e8e8ee; }
  .bn a { flex: 1; display: grid; place-items: center; gap: 2px; padding: 8px 0 10px; font-size: 10px; color: #9a9aa4; text-decoration: none; }
  .bn i { width: 18px; height: 18px; border-radius: 5px; background: #d4d4dd; font-style: normal; }
  .bn a.on { color: #17171b; font-weight: 700; }
  .bn a.on i { background: #17171b; }
</style>
<div class="bd3"><div class="bar" style="width:85%"></div></div>
<nav class="bn"><a href="#" class="on"><i></i>홈</a><a href="#"><i></i>검색</a><a href="#"><i></i>알림</a><a href="#"><i></i>내 정보</a></nav>
</body>
</html>
