<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>체크박스 Checkbox — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .ck { display: grid; gap: 8px; font-size: 12.5px; }
  .ck p { margin: 0 0 2px; color: #9a9aa4; font-size: 11px; }
  .ck label { display: flex; gap: 7px; align-items: center; cursor: pointer; }
  .ck input { width: 15px; height: 15px; accent-color: #17171b; }
</style>
<div class="center"><div class="ck"><p>여러 개 고를 수 있어요</p>
  <label><input type="checkbox" checked>마케팅</label>
  <label><input type="checkbox" checked>개발</label>
  <label><input type="checkbox">디자인</label>
</div></div>
</body>
</html>
