<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텍스트에어리어 Textarea — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .ta { width: 230px; }
  .ta label { font-size: 11px; font-weight: 600; display: block; margin-bottom: 4px; }
  .ta textarea { width: 100%; min-height: 72px; padding: 9px 11px; border: 1px solid #e0e0e8; border-radius: 8px; font-size: 12.5px; box-sizing: border-box; font-family: inherit; resize: vertical; }
  .ta textarea:focus { outline: 2px solid #17171b; border-color: transparent; }
</style>
<div class="center"><div class="ta"><label>문의 내용</label><textarea placeholder="어떤 걸 만들고 싶으신지 편하게 적어주세요"></textarea></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
