<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>눌리면 찌그러지는 버튼 Squish Button · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .sq { padding: 13px 30px; border: 0; border-radius: 12px; background: #e0733f; color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: transform .35s cubic-bezier(.34,1.8,.5,1), background .15s; }
  .sq:active { transform: scale(.92); transition-duration: .08s; background: #c95f2d; }
  .sq:focus-visible { outline: 3px solid #17171b; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { .sq, .sq:active { transform: none; } }
</style>
<div class="center"><div style="text-align:center"><button class="sq" id="sq">장바구니 담기</button><p class="cap">누르면 눌렸다가 떼면 통 튀어요</p></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
