<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>목록 + 상세 Table+Sheet+Badge+Button+DropdownMenu — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .ld { font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif; background: #f7f8fa; height: 100%; position: relative; padding: 14px; overflow: hidden; }
  .ld * { box-sizing: border-box; }
  .ld table { width: 100%; background: #fff; border: 1px solid #e8e8ee; border-radius: 10px; border-collapse: collapse; overflow: hidden; font-size: 12px; }
  .ld th, .ld td { text-align: left; padding: 9px 12px; border-bottom: 1px solid #f0f0f4; }
  .ld th { background: #f7f8fa; color: #9a9aa4; font-size: 10px; }
  .ld tr.sel td { background: #f0f4ff; }
  .ld .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #eef6f0; color: #1f7a4d; }
  .ld .dots { color: #9a9aa4; cursor: pointer; }
  .ld .sheet { position: absolute; top: 0; right: 0; bottom: 0; width: 150px; background: #fff; border-left: 1px solid #e8e8ee; box-shadow: -8px 0 20px rgba(0,0,0,.06); padding: 16px; }
  .ld .sheet h4 { margin: 0 0 4px; font-size: 14px; }
  .ld .sheet p { margin: 0 0 10px; font-size: 11px; color: #9a9aa4; }
  .ld .sheet .k { font-size: 10px; color: #9a9aa4; margin-top: 8px; }
  .ld .sheet .v { font-size: 12px; }
</style>
<div class="ld">
  <table>
    <tr><th>주문</th><th>고객</th><th>상태</th><th></th></tr>
    <tr class="sel"><td>#1042</td><td>김하마</td><td><span class="badge">배송중</span></td><td class="dots">⋯</td></tr>
    <tr><td>#1041</td><td>이토끼</td><td><span class="badge">완료</span></td><td class="dots">⋯</td></tr>
    <tr><td>#1040</td><td>박여우</td><td><span class="badge">완료</span></td><td class="dots">⋯</td></tr>
  </table>
  <div class="sheet">
    <h4>주문 #1042</h4><p>2026-09-13</p>
    <div class="k">고객</div><div class="v">김하마</div>
    <div class="k">금액</div><div class="v">₩38,000</div>
    <div class="k">상태</div><div class="v">배송중</div>
  </div>
</div>
<p class="cap">Table + Sheet + Badge + Button + DropdownMenu</p>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
