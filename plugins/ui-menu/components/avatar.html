<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아바타 Avatar — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .av3 { display: flex; gap: 12px; align-items: center; }
  .av3 span { border-radius: 50%; display: grid; place-items: center; color: #fff; }
  .a1 { width: 38px; height: 38px; background: #17171b; font-size: 14px; }
  .a2 { width: 30px; height: 30px; background: linear-gradient(135deg, #c3ccd8, #97a4b4); }
</style>
<div class="center"><div style="text-align:center"><div class="av3"><span class="a1">쥬</span><span class="a2"></span></div><p class="cap">사진 없으면 첫 글자로</p></div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
