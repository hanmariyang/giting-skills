<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검색바 Search Bar — UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #17171b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #9a9aa4; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #ececf1; border-radius: 4px; height: 10px; }
  .mut { color: #9a9aa4; font-size: 12px; }
</style>
</head>
<body>
<style>
  .sb2 { width: 230px; position: relative; }
  .sb2 input { width: 100%; padding: 9px 11px 9px 30px; border: 1px solid #e0e0e8; border-radius: 9px; font-size: 12.5px; box-sizing: border-box; font-family: inherit; }
  .sb2 input:focus { outline: 2px solid #17171b; border-color: transparent; }
  .sb2 .ic { position: absolute; left: 10px; top: 9px; color: #9a9aa4; font-size: 13px; }
  .sb2 .rs { margin-top: 6px; border: 1px solid #e8e8ee; border-radius: 9px; overflow: hidden; font-size: 12px; }
  .sb2 .rs div { padding: 8px 11px; }
  .sb2 .rs div + div { border-top: 1px solid #f0f0f4; }
  .sb2 .rs div:hover { background: #f8f8fa; }
</style>
<div class="center"><div class="sb2">
  <span class="ic">&#8981;</span><input value="바이브코딩" aria-label="검색">
  <div class="rs"><div>바이브코딩 시작하기</div><div>바이브코딩 도구 비교</div></div>
</div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
