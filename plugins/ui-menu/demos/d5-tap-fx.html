  .sw li { position: relative; border-bottom: 1px solid #ececf1; }
  .sw li:last-child { border-bottom: 0; }
  .sw .acts { position: absolute; right: 0; top: 0; bottom: 0; display: flex; }
  .sw .acts button { width: 66px; border: 0; color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .sw .acts .ar { background: #6b6b76; } .sw .acts .del { background: #d64224; }
  .sw .row { position: relative; display: flex; align-items: center; gap: 10px; padding: 12px 12px; background: #fff; touch-action: pan-y; transition: transform .25s ease-out; user-select: none; -webkit-user-select: none; }
  .sw .row.drag { transition: none; }
  .sw .row.open { transform: translateX(-132px); }
  .sw .av { width: 30px; height: 30px; border-radius: 50%; background: #c9d3f3; flex: none; }
  .sw .t { flex: 1; min-width: 0; } .sw .t b { display: block; font-size: 13px; } .sw .t span { font-size: 11.5px; color: #9a9aa4; }
  .sw .more { border: 0; background: none; font-size: 18px; color: #9a9aa4; cursor: pointer; padding: 4px 6px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) { .sw .row { transition: none; } }
</style>
<div class="center"><div><ul class="sw" id="sw">
  <li><div class="acts"><button class="ar" tabindex="-1">보관</button><button class="del" tabindex="-1">삭제</button></div><div class="row"><span class="av"></span><span class="t"><b>민지</b><span>내일 몇 시에 봐?</span></span><button class="more" aria-label="민지 메시지 버튼 열기" aria-expanded="false">⋯</button></div></li>
  <li><div class="acts"><button class="ar" tabindex="-1">보관</button><button class="del" tabindex="-1">삭제</button></div><div class="row"><span class="av" style="background:#fde2d2"></span><span class="t"><b>택배 알림</b><span>오늘 도착 예정</span></span><button class="more" aria-label="택배 알림 버튼 열기" aria-expanded="false">⋯</button></div></li>
</ul><p class="cap">줄을 왼쪽으로 밀어 보세요</p></div></div>
<script>
  (function () {
    document.querySelectorAll('#sw li').forEach(function (li) {
      var row = li.querySelector('.row'), more = li.querySelector('.more'), acts = li.querySelectorAll('.acts button'), x0 = null, dx = 0, moved = false;
      function set(open) {
        row.classList.toggle('open', open); more.setAttribute('aria-expanded', open);
        acts.forEach(function (b) { b.tabIndex = open ? 0 : -1; });
      }
      more.addEventListener('click', function (e) { e.stopPropagation(); set(!row.classList.contains('open')); });
      row.addEventListener('pointerdown', function (e) { if (e.target === more) return; x0 = e.clientX; dx = 0; moved = false; });
      addEventListener('pointermove', function (e) {
        if (x0 === null) return; dx = e.clientX - x0; if (!moved && Math.abs(dx) < 10) return;
        moved = true; row.classList.add('drag');
        var base = row.classList.contains('open') ? -132 : 0;
        row.style.transform = 'translateX(' + Math.max(-150, Math.min(0, base + dx)) + 'px)';
      });
      addEventListener('pointerup', function () {
        if (x0 === null) return; x0 = null; row.classList.remove('drag'); row.style.transform = '';
        if (moved) set(row.classList.contains('open') ? dx < 60 : dx < -60);
      });
      acts.forEach(function (b) { b.addEventListener('click', function () { set(false); }); });
    });
  })();
</script>

<style>
  .cr { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border: 1.5px solid #e0e0e8; border-radius: 999px; background: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }

  .cr .num { display: inline-flex; font-variant-numeric: tabular-nums; }
  .cr .d { position: relative; display: inline-block; width: .62em; height: 1.2em; overflow: hidden; }
  .cr .d span { position: absolute; left: 0; right: 0; text-align: center; line-height: 1.2em; transition: transform .35s cubic-bezier(.3,.9,.3,1); }
  .cr .d .old { transform: translateY(0); } .cr .d.go .old { transform: translateY(-100%); }
  .cr .d .new { transform: translateY(100%); } .cr .d.go .new { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .cr .d span { transition: none; } }
</style>
<div class="center"><div style="text-align:center">
  <button class="cr" id="cr" aria-describedby="crl"><span class="hrt" aria-hidden="true">♥</span><span class="num" id="crn" aria-hidden="true"></span></button>
  <p class="cap" id="crl" aria-live="polite">좋아요 1,298</p>
</div></div>
<script>
  (function () {
    var b = document.getElementById('cr'), box = document.getElementById('crn'), l = document.getElementById('crl'), n = 1298;
    function fmt(v) { return v.toLocaleString('en-US'); }
    function draw(prev, next) {
      var a = fmt(prev), c = fmt(next); while (a.length < c.length) a = ' ' + a;
      box.innerHTML = '';
      for (var i = 0; i < c.length; i++) {
        var d = document.createElement('span'); d.className = 'd'; if (c[i] === ',') d.style.width = '.3em';
        d.innerHTML = '<span class="old">' + a[i] + '</span><span class="new">' + c[i] + '</span>';
        box.appendChild(d);
        if (a[i] !== c[i]) (function (d) { requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.add('go'); }); }); })(d);
        else d.classList.add('go');
      }
    }
    draw(n, n);
    b.addEventListener('click', function () { draw(n, n + 1); n++; l.textContent = '좋아요 ' + fmt(n); });
  })();
</script>
